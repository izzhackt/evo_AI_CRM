name: EVO fast PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evo-fast-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-range:
    name: Changed range
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refresh the main release baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Reject whitespace errors in the complete release diff
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "origin/main..$HEAD_SHA"

  fast-checks:
    name: Fast checks
    needs: changed-range
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test release contracts
        run: npm run test:fast-release

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
