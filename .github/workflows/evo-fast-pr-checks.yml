name: EVO fast PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evo-fast-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-range:
    name: Changed range
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.classify.outputs.has_changes }}
      ordinary_docs: ${{ steps.classify.outputs.ordinary_docs }}
      contracts: ${{ steps.classify.outputs.contracts }}
      migration_boundary: ${{ steps.classify.outputs.migration_boundary }}
      code: ${{ steps.classify.outputs.code }}
      lint: ${{ steps.classify.outputs.lint }}
      build: ${{ steps.classify.outputs.build }}
      mobile: ${{ steps.classify.outputs.mobile }}
      unknown: ${{ steps.classify.outputs.unknown }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refresh the main release baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Reject whitespace errors in the complete release diff
        run: git diff --check origin/main...HEAD

      - name: Classify PR changes
        id: classify
        env:
          BASE_SHA: origin/main
          HEAD_SHA: HEAD
        run: |
          set -Eeuo pipefail
          format_base_sha=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          format_head_sha=$(git rev-parse "$HEAD_SHA")
          node scripts/checks/classify-pr-changes.mjs --base "$format_base_sha" --head "$format_head_sha" --github-output "$GITHUB_OUTPUT"

      - name: Validate classifier outputs
        env:
          HAS_CHANGES: ${{ steps.classify.outputs.has_changes }}
          ORDINARY_DOCS: ${{ steps.classify.outputs.ordinary_docs }}
          CONTRACTS: ${{ steps.classify.outputs.contracts }}
          MIGRATION_BOUNDARY: ${{ steps.classify.outputs.migration_boundary }}
          CODE: ${{ steps.classify.outputs.code }}
          LINT: ${{ steps.classify.outputs.lint }}
          BUILD: ${{ steps.classify.outputs.build }}
          MOBILE: ${{ steps.classify.outputs.mobile }}
          UNKNOWN: ${{ steps.classify.outputs.unknown }}
        run: |
          set -Eeuo pipefail
          for value in "$HAS_CHANGES" "$ORDINARY_DOCS" "$CONTRACTS" "$MIGRATION_BOUNDARY" "$CODE" "$LINT" "$BUILD" "$MOBILE" "$UNKNOWN"; do
            case "$value" in
              true|false) ;;
              *)
                echo "::error::PR classifier returned an invalid boolean output"
                exit 1
                ;;
            esac
          done

  # The types and the whole Node test manifest run on every change that is not ordinary docs: code, workflows,
  # migrations and the mobile app alike (PLAN_CHANGES 22.11.2026: fast and strict CI, superseding the light checks of
  # #821). `npm run verify` is the one command: the same steps run on a laptop.
  typecheck:
    name: Types
    needs: changed-range
    if: ${{ needs.changed-range.outputs.has_changes == 'true' && needs.changed-range.outputs.ordinary_docs != 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # node_modules is a pure function of the lockfile and Node: a hit skips `npm ci`, a miss installs as before.
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install locked dependencies
        if: ${{ steps.deps.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Check types
        run: npm run verify -- --only typecheck

  tests:
    name: Tests (${{ matrix.shard }}/4)
    needs: changed-range
    if: ${{ needs.changed-range.outputs.has_changes == 'true' && needs.changed-range.outputs.ordinary_docs != 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # node_modules is a pure function of the lockfile and Node: a hit skips `npm ci`, a miss installs as before.
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install locked dependencies
        if: ${{ steps.deps.outputs.cache-hit != 'true' }}
        run: npm ci

      # Browser-rendered UI tests (tests/ai-agents-ui.test.mjs) need Chromium. With EVO_REQUIRE_BROWSER they fail instead
      # of skipping when it does not start (PLAN_CHANGES 22.11.2026).
      - name: Install Chromium
        run: node_modules/.bin/playwright install --with-deps --only-shell chromium

      - name: Run the Node test manifest (one of four parts)
        env:
          EVO_REQUIRE_BROWSER: "1"
        run: npm run verify -- --only tests --shard ${{ matrix.shard }}/4

  # The PR's real app on a throwaway synthetic stack, checked in a browser (owner's choice «A: превью в CI», 22.11.2026):
  # all migrations, synthetic accounts only, no secrets; key pages as a staff admin and as a student. Screenshots, the
  # redacted logs and the page timing table are the artifact.
  preview:
    name: Preview (synthetic stack and browser)
    needs: changed-range
    if: ${{ needs.changed-range.outputs.has_changes == 'true' && needs.changed-range.outputs.ordinary_docs != 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # node_modules is a pure function of the lockfile and Node: a hit skips `npm ci`, a miss installs as before.
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install locked dependencies
        if: ${{ steps.deps.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Install Chromium
        run: node_modules/.bin/playwright install --with-deps --only-shell chromium

      - name: Run the PR preview
        run: npm run verify -- --only preview

      - name: Redact uploaded logs
        if: ${{ always() }}
        run: node scripts/ci/redact.mjs output/pr-preview/app.log output/pr-preview/build.log output/pr-preview/summary.md

      - name: Upload screenshots, logs and timing table
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evo-pr-preview-${{ github.event.pull_request.number }}
          path: |
            output/pr-preview/summary.md
            output/pr-preview/screenshots/
            output/pr-preview/app.log
            output/pr-preview/build.log
          if-no-files-found: warn
          retention-days: 7

  contracts:
    name: Release contracts
    needs: changed-range
    if: ${{ needs.changed-range.outputs.contracts == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # node_modules is a pure function of the lockfile and Node: a hit skips `npm ci`, a miss installs as before.
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install locked dependencies
        if: ${{ steps.deps.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Test release contracts
        run: npm run verify -- --only contracts

  lint:
    name: Lint
    needs: changed-range
    if: ${{ needs.changed-range.outputs.lint == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # node_modules is a pure function of the lockfile and Node: a hit skips `npm ci`, a miss installs as before.
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install locked dependencies
        if: ${{ steps.deps.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Lint
        run: npm run verify -- --only lint

  build:
    name: Build
    needs: changed-range
    if: ${{ needs.changed-range.outputs.build == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # node_modules is a pure function of the lockfile and Node: a hit skips `npm ci`, a miss installs as before.
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install locked dependencies
        if: ${{ steps.deps.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Build with TypeScript authority
        run: npm run verify -- --only build

  mobile:
    name: Mobile app
    needs: changed-range
    if: ${{ needs.changed-range.outputs.mobile == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked dependencies
        working-directory: mobile
        run: npm ci

      # «Замок отпечатка нативной сборки» (AGENTS.md, «Кабинет и приложение идут вместе»): отпечаток Expo (runtimeVersion)
      # приложения должен равняться mobile/native-fingerprint.lock.json, иначе обновление по воздуху (EAS Update) не дойдёт
      # ни до одного установленного приложения. Это отдельный именованный шаг сразу после `npm ci`, чтобы сбой было видно.
      # Он идёт в этом задании: оно запускается, когда PR меняет mobile/ или общий код веба, который приложение берёт как
      # @web/*, а «Fast checks» требует «success» именно тогда (skipped значит «нечего проверять», а не «не смотрел»).
      # Шаг не пропускает молча: не смог посчитать, замок потерян или испорчен - падает. Переменная репозитория
      # MOBILE_FINGERPRINT_LOCK_MODE=warn (`gh variable set MOBILE_FINGERPRINT_LOCK_MODE --body warn`) превращает падение
      # в предупреждение, `gh variable delete MOBILE_FINGERPRINT_LOCK_MODE` возвращает строгий режим.
      - name: Check the native fingerprint lock
        env:
          MOBILE_FINGERPRINT_LOCK_MODE: ${{ vars.MOBILE_FINGERPRINT_LOCK_MODE }}
        run: |
          set -Eeuo pipefail
          # main only helps to explain a difference (which sources changed): a failed fetch must not hide the verdict.
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main \
            || echo "::warning title=Native fingerprint lock::origin/main could not be fetched, so a failure below will not say which sources changed"
          node scripts/ci/mobile-native-fingerprint-check.mjs --base origin/main

      - name: Check the mobile app
        run: npm run verify -- --only mobile

      # Приложение выходит скомпилированным (`experiments.reactCompiler`), а проверка выше гоняет тесты без компилятора: `jest-expo` не ставит
      # признак, который ставит Metro. Поэтому ошибка, которая есть только в скомпилированном коде, её проходит: N3 (26.11.2026) -
      # `navigation.getState()` в теле хука, который компилятор запомнил на всю жизнь экрана. Этот шаг гоняет те же тесты через компилятор
      # так, как приложение собирает Metro (`mobile/jest.compiler.transform.js`). Команда - шаг `mobile-compiled` в `scripts/ci/verify.mjs`
      # (простой `npm run verify` на ноутбуке запускает тот же), а не строка в `scripts` файла `mobile/package.json`: раздел `scripts`
      # входит в нативный отпечаток (шаг «Check the native fingerprint lock» выше).
      - name: Run the mobile Jest suite through the React Compiler
        run: npm run verify -- --only mobile-compiled

  # «Кабинет и приложение идут вместе» (AGENTS.md, правило владельца 25.11.2026): PR, который меняет то, что студент видит
  # (кабинет, вход, заявка; список путей в AGENTS.md и в scripts/ci/mobile-parity-check.mjs), меняет и приложение либо одной
  # строкой в описании говорит, почему приложению это не нужно. «Fast checks» ниже ждёт этого задания и требует «success», поэтому проверка обязательна и без правки
  # настроек ветки. Скрипт сам не ломает PR: при своей временной ошибке (сеть, 5xx, git, ввод) он печатает предупреждение
  # (в логе, аннотацией и в итоге шага) и выходит с 0. Падает он, когда точно знает, что правило нарушено, и когда в Actions
  # не может прочитать описание этого PR из-за прав или настройки (HTTP 401/403/404): молча пропускать такое нельзя.
  # Переменная репозитория MOBILE_PARITY_MODE=warn превращает падения в предупреждения. Описание читается через API при запуске,
  # а не из события: после правки описания хватает перезапуска упавшего задания (`gh run rerun <run-id> --failed`),
  # событие pull_request при перезапуске остаётся от первого запуска.
  mobile-parity:
    name: Mobile parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Check that the cabinet and the app change together
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Emergency switch that needs no settings edit: `gh variable set MOBILE_PARITY_MODE --body warn` turns the
          # check's failures into warnings (exit 0); `gh variable delete MOBILE_PARITY_MODE` brings the strict mode back.
          MOBILE_PARITY_MODE: ${{ vars.MOBILE_PARITY_MODE }}
        run: node scripts/ci/mobile-parity-check.mjs --base origin/main

  migration_boundary:
    name: Migration boundary
    needs: changed-range
    if: ${{ needs.changed-range.outputs.migration_boundary == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      # A baseline of main's tail lets a PR that only adds migrations apply just those (PLAN_CHANGES 22.11.2026); anything
      # else, or no usable baseline, runs the full chain, announced on the first line of the boundary log.
      - name: Resolve the migration baseline key
        id: baseline
        run: |
          set -Eeuo pipefail
          # No key only costs time: the harness then runs the whole chain. It must never fail the check by itself.
          if git fetch --no-tags origin main:refs/remotes/origin/main \
            && key="$(node scripts/test-runners/migration-baseline.mjs key --merge-base-with origin/main)" \
            && [[ -n "$key" ]]; then
            echo "key=$key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Migration baseline::no baseline key, so the boundary check runs the whole chain"
          fi

      - name: Restore the migration baseline (a miss only means the full chain)
        if: ${{ steps.baseline.outputs.key != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/migration-baseline
          key: ${{ steps.baseline.outputs.key }}
          restore-keys: migration-baseline-v1-

      - name: Classify the exact migration boundary diff
        id: migration-scope
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          boundary_diff="$(git diff --name-status --no-renames origin/main...HEAD -- supabase/migrations/ supabase/tests/ scripts/test-runners/test-postgres-authorization.sh)"
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/171_platform_team_chat_remove_mute.sql' ]]; then
            echo "scoped_chat_mute=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_chat_mute=false" >> "$GITHUB_OUTPUT"
          fi
          staff_diff=$'A\tsupabase/migrations/173_platform_staff_business_roles.sql\nA\tsupabase/migrations/174_platform_sales_report_handoff.sql\nA\tsupabase/migrations/175_platform_staff_password_onboarding.sql'
          if [[ "$boundary_diff" == "$staff_diff" ]]; then
            echo "scoped_staff_handoff=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_staff_handoff=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/172_reserved_student_signup_slot.sql' ]]; then
            echo "scoped_retired_slot=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_retired_slot=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/177_platform_public_student_applications.sql' ]]; then
            echo "scoped_student_intake=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_student_intake=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/178_platform_student_application_conflict_codes.sql' ]]; then
            echo "scoped_student_conflicts=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_student_conflicts=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/176_platform_docs_student_intake.sql' ]]; then
            echo "scoped_docs_intake=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_docs_intake=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/186_platform_student_invite_conflict_codes.sql' ]]; then
            echo "scoped_invite_conflicts=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_invite_conflicts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check scoped 171 function source contract
        if: ${{ steps.migration-scope.outputs.scoped_chat_mute == 'true' }}
        run: |
          echo "Scoped migration 171 source-contract check only; real SQL and authenticated runtime validation remain separate release evidence."
          node --test tests/team-chat-mute-removal.test.mjs

      - name: Check scoped staff migration source contracts
        if: ${{ steps.migration-scope.outputs.scoped_staff_handoff == 'true' }}
        run: |
          echo "Exact added migrations 173–175 source-contract checks only; real SQL rollback compilation and authenticated runtime validation remain separate release evidence."
          node --test tests/staff-roles-sales-handoff-migrations.test.mjs

      - name: Test migration boundary
        if: ${{ steps.migration-scope.outputs.scoped_chat_mute != 'true' && steps.migration-scope.outputs.scoped_staff_handoff != 'true' && steps.migration-scope.outputs.scoped_retired_slot != 'true' && steps.migration-scope.outputs.scoped_docs_intake != 'true' && steps.migration-scope.outputs.scoped_student_intake != 'true' && steps.migration-scope.outputs.scoped_student_conflicts != 'true' && steps.migration-scope.outputs.scoped_invite_conflicts != 'true' }}
        env:
          EVO_MIGRATION_BOUNDARY_MODE: auto
          EVO_MIGRATION_BASELINE_DIR: ${{ github.workspace }}/.cache/migration-baseline
        run: npm run test:database:migration-boundaries

      - name: Check scoped Docs intake source boundary
        if: ${{ steps.migration-scope.outputs.scoped_docs_intake == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const sql = readFileSync('supabase/migrations/176_platform_docs_student_intake.sql', 'utf8');
          assert.match(sql, /^BEGIN;/m);
          assert.match(sql, /COMMIT;\s*$/);
          assert.match(sql, /SECURITY DEFINER/i);
          assert.match(sql, /REVOKE ALL ON FUNCTION/i);
          assert.doesNotMatch(sql, /DISABLE\s+(?:ROW LEVEL SECURITY|TRIGGER)|session_replication_role|ALTER\s+TABLE\s+auth\./i);
          console.log('Exact176 source boundary only; actual SQL compilation and rolled-back staff command proof are separate release evidence.');
          NODE

      - name: Check scoped public Student intake source boundary
        if: ${{ steps.migration-scope.outputs.scoped_student_intake == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const path = 'supabase/migrations/177_platform_public_student_applications.sql';
          const sql = readFileSync(path, 'utf8');
          const evidence = JSON.parse(readFileSync('docs/qa/student-public-onboarding-177-local-2026-09-18.json', 'utf8'));
          assert.match(sql, /^BEGIN;/m);
          assert.match(sql, /COMMIT;\s*$/);
          assert.match(sql, /SECURITY DEFINER/i);
          assert.match(sql, /REVOKE ALL ON FUNCTION/i);
          assert.doesNotMatch(sql, /DISABLE\s+(?:ROW LEVEL SECURITY|TRIGGER)|session_replication_role|ALTER\s+TABLE\s+auth\./i);
          assert.equal(createHash('sha256').update(sql).digest('hex'), evidence.browserEvidence.sourceSha256[path]);
          assert.equal(createHash('sha256').update(sql).digest('hex'), evidence.finalMigrationRollbackCompile.migrationSha256);
          assert.equal(evidence.finalMigrationRollbackCompile.baseMigration, '176');
          assert.equal(evidence.finalMigrationRollbackCompile.compiledMigration, '177');
          console.log('Exact177 source boundary and recorded source hash only; real SQL rollback compilation and Auth/RPC/UI evidence remain separately recorded.');
          NODE

      - name: Check scoped Student conflict source and evidence binding
        if: ${{ steps.migration-scope.outputs.scoped_student_conflicts == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const sql = readFileSync('supabase/migrations/178_platform_student_application_conflict_codes.sql', 'utf8');
          const receipt = readFileSync('docs/qa/student-signup-conflict-178-2026-09-18.md', 'utf8');
          const blocks = [...receipt.matchAll(/^```json\r?\n([\s\S]*?)^```[ \t]*$/gm)];
          assert.equal(blocks.length, 1, 'Expected exactly one JSON evidence block');
          const evidence = JSON.parse(blocks[0][1]);
          assert.equal(createHash('sha256').update(sql).digest('hex'), evidence.migrationSha256);
          assert.equal(evidence.productionRollbackCompile.functions, 2);
          assert.equal(evidence.productionRollbackCompile.authorityUnchanged, true);
          assert.equal(evidence.productionRollbackCompile.onlyCodesChanged, true);
          assert.equal(evidence.localAuthenticatedRpc.status, 409);
          assert.equal(evidence.localAuthenticatedRpc.code, 'PT409');
          assert.equal(evidence.localAuthenticatedRpc.stateUnchanged, true);
          console.log('Exact added178 source/evidence binding only; CI did not execute SQL or authenticated RPC. Real rollback compilation and local RPC results are separately recorded.');
          NODE

      - name: Check scoped invite conflict source and evidence binding
        if: ${{ steps.migration-scope.outputs.scoped_invite_conflicts == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const sql = readFileSync('supabase/migrations/186_platform_student_invite_conflict_codes.sql', 'utf8');
          const receipt = readFileSync('docs/qa/portal-identity-conflict-186-2026-09-19.md', 'utf8');
          const blocks = [...receipt.matchAll(/^```json\r?\n([\s\S]*?)^```[ \t]*$/gm)];
          assert.equal(blocks.length, 1, 'Expected exactly one JSON evidence block');
          const evidence = JSON.parse(blocks[0][1]);
          assert.equal(createHash('sha256').update(sql).digest('hex'), evidence.migrationSha256);
          assert.equal(evidence.productionRollbackCompile.functions, 2);
          for (const key of ['authorityUnchanged', 'onlyCodesChanged', 'rolledBack', 'readbackRestored']) {
            assert.equal(evidence.productionRollbackCompile[key], true, key);
          }
          assert.equal(evidence.productionSqlConflict.code, 'PT409');
          assert.equal(evidence.productionSqlConflict.message, 'portal_identity_conflict');
          assert.equal(evidence.productionSqlConflict.existingIdentity, true);
          assert.equal(evidence.productionSqlConflict.stateUnchanged, true);
          console.log('Exact added186 source/evidence binding only; CI did not execute production SQL or HTTP. Real rollback SQL proof is separately recorded; HTTP/UI/release evidence follows deployment.');
          NODE

      - name: Check retired unused migration slot
        if: ${{ steps.migration-scope.outputs.scoped_retired_slot == 'true' }}
        run: node --test tests/staff-roles-sales-handoff-migrations.test.mjs

  fast-checks:
    name: Fast checks
    if: ${{ always() }}
    needs:
      - changed-range
      - typecheck
      - tests
      - preview
      - contracts
      - lint
      - build
      - mobile
      - migration_boundary
      - mobile-parity
    runs-on: ubuntu-latest
    steps:
      - name: Require selected fast PR checks
        env:
          RANGE_RESULT: ${{ needs.changed-range.result }}
          HAS_CHANGES: ${{ needs.changed-range.outputs.has_changes }}
          UNKNOWN: ${{ needs.changed-range.outputs.unknown }}
          ORDINARY_DOCS: ${{ needs.changed-range.outputs.ordinary_docs }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          MOBILE_CHANGED: ${{ needs.changed-range.outputs.mobile }}
          MIGRATION_BOUNDARY_RESULT: ${{ needs.migration_boundary.result }}
          MOBILE_PARITY_RESULT: ${{ needs.mobile-parity.result }}
        run: |
          set -Eeuo pipefail
          test "$RANGE_RESULT" = "success"
          test "$HAS_CHANGES" = "true"
          test "$UNKNOWN" = "false"
          # Anything but ordinary docs must actually run the types, every test part and the preview: «skipped» is not enough.
          if test "$ORDINARY_DOCS" != "true"; then
            test "$TYPECHECK_RESULT" = "success"
            test "$TESTS_RESULT" = "success"
            test "$PREVIEW_RESULT" = "success"
          fi
          for result in "$TYPECHECK_RESULT" "$TESTS_RESULT" "$PREVIEW_RESULT" "$CONTRACTS_RESULT" "$LINT_RESULT" "$BUILD_RESULT" "$MOBILE_RESULT" "$MIGRATION_BOUNDARY_RESULT" "$MOBILE_PARITY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A selected fast PR check failed or was cancelled"
                exit 1
                ;;
            esac
          done
          # «Mobile parity» has no condition and looks at every pull request: «skipped» would mean it never looked.
          if test "$MOBILE_PARITY_RESULT" != "success"; then
            echo "::error::Mobile parity must succeed on every pull request, but its result is '${MOBILE_PARITY_RESULT}' (skipped means it never looked)"
            exit 1
          fi
          # «Mobile app» holds the native-fingerprint lock. It is skipped only when changed-range says the pull request touches
          # neither mobile/ nor the web code the app shares (mobile=false): then there is nothing to lock. When it says
          # mobile=true, a skipped «Mobile app» would mean the lock never looked.
          if test "${MOBILE_CHANGED:-}" = "true" && test "$MOBILE_RESULT" != "success"; then
            echo "::error::The mobile app checks and the native-fingerprint lock must succeed when the pull request changes mobile/ or the web code the app shares, but their result is '${MOBILE_RESULT}' (skipped means they never looked)"
            exit 1
          fi
