name: EVO fast PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evo-fast-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-range:
    name: Changed range
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.classify.outputs.has_changes }}
      ordinary_docs: ${{ steps.classify.outputs.ordinary_docs }}
      contracts: ${{ steps.classify.outputs.contracts }}
      migration_boundary: ${{ steps.classify.outputs.migration_boundary }}
      code: ${{ steps.classify.outputs.code }}
      lint: ${{ steps.classify.outputs.lint }}
      build: ${{ steps.classify.outputs.build }}
      inbox_dependencies: ${{ steps.classify.outputs.inbox_dependencies }}
      inbox_formatting: ${{ steps.classify.outputs.inbox_formatting }}
      format_base_sha: ${{ steps.classify.outputs.format_base_sha }}
      format_head_sha: ${{ steps.classify.outputs.format_head_sha }}
      lead_agent_dependencies: ${{ steps.classify.outputs.lead_agent_dependencies }}
      unknown: ${{ steps.classify.outputs.unknown }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refresh the main release baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Reject whitespace errors in the complete release diff
        run: git diff --check origin/main...HEAD

      - name: Classify PR changes
        id: classify
        env:
          BASE_SHA: origin/main
          HEAD_SHA: HEAD
        run: |
          set -Eeuo pipefail
          format_base_sha=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          format_head_sha=$(git rev-parse "$HEAD_SHA")
          printf 'format_base_sha=%s\nformat_head_sha=%s\n' "$format_base_sha" "$format_head_sha" >> "$GITHUB_OUTPUT"
          node scripts/classify-pr-changes.mjs --base "$format_base_sha" --head "$format_head_sha" --github-output "$GITHUB_OUTPUT"

      - name: Validate classifier outputs
        env:
          HAS_CHANGES: ${{ steps.classify.outputs.has_changes }}
          ORDINARY_DOCS: ${{ steps.classify.outputs.ordinary_docs }}
          CONTRACTS: ${{ steps.classify.outputs.contracts }}
          MIGRATION_BOUNDARY: ${{ steps.classify.outputs.migration_boundary }}
          CODE: ${{ steps.classify.outputs.code }}
          LINT: ${{ steps.classify.outputs.lint }}
          BUILD: ${{ steps.classify.outputs.build }}
          INBOX_DEPENDENCIES: ${{ steps.classify.outputs.inbox_dependencies }}
          INBOX_FORMATTING: ${{ steps.classify.outputs.inbox_formatting }}
          LEAD_AGENT_DEPENDENCIES: ${{ steps.classify.outputs.lead_agent_dependencies }}
          UNKNOWN: ${{ steps.classify.outputs.unknown }}
        run: |
          set -Eeuo pipefail
          for value in "$HAS_CHANGES" "$ORDINARY_DOCS" "$CONTRACTS" "$MIGRATION_BOUNDARY" "$CODE" "$LINT" "$BUILD" "$INBOX_DEPENDENCIES" "$INBOX_FORMATTING" "$LEAD_AGENT_DEPENDENCIES" "$UNKNOWN"; do
            case "$value" in
              true|false) ;;
              *)
                echo "::error::PR classifier returned an invalid boolean output"
                exit 1
                ;;
            esac
          done

  contracts:
    name: Release contracts
    needs: changed-range
    if: ${{ needs.changed-range.outputs.contracts == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test release contracts
        run: npm run test:fast-release

  lint:
    name: Lint
    needs: changed-range
    if: ${{ needs.changed-range.outputs.lint == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build:
    name: Build
    needs: changed-range
    if: ${{ needs.changed-range.outputs.build == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build with TypeScript authority
        run: npm run build

  migration_boundary:
    name: Migration boundary
    needs: changed-range
    if: ${{ needs.changed-range.outputs.migration_boundary == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Classify the exact migration boundary diff
        id: migration-scope
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          boundary_diff="$(git diff --name-status --no-renames origin/main...HEAD -- supabase/migrations/ supabase/tests/ scripts/test-postgres-authorization.sh)"
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/171_platform_team_chat_remove_mute.sql' ]]; then
            echo "scoped_chat_mute=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_chat_mute=false" >> "$GITHUB_OUTPUT"
          fi
          staff_diff=$'A\tsupabase/migrations/173_platform_staff_business_roles.sql\nA\tsupabase/migrations/174_platform_sales_report_handoff.sql\nA\tsupabase/migrations/175_platform_staff_password_onboarding.sql'
          if [[ "$boundary_diff" == "$staff_diff" ]]; then
            echo "scoped_staff_handoff=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_staff_handoff=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/172_reserved_student_signup_slot.sql' ]]; then
            echo "scoped_retired_slot=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_retired_slot=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/177_platform_public_student_applications.sql' ]]; then
            echo "scoped_student_intake=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_student_intake=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/178_platform_student_application_conflict_codes.sql' ]]; then
            echo "scoped_student_conflicts=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_student_conflicts=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/176_platform_docs_student_intake.sql' ]]; then
            echo "scoped_docs_intake=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_docs_intake=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$boundary_diff" == $'A\tsupabase/migrations/186_platform_student_invite_conflict_codes.sql' ]]; then
            echo "scoped_invite_conflicts=true" >> "$GITHUB_OUTPUT"
          else
            echo "scoped_invite_conflicts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check scoped 171 function source contract
        if: ${{ steps.migration-scope.outputs.scoped_chat_mute == 'true' }}
        run: |
          echo "Scoped migration 171 source-contract check only; real SQL and authenticated runtime validation remain separate release evidence."
          node --test tests/team-chat-mute-removal.test.mjs

      - name: Check scoped staff migration source contracts
        if: ${{ steps.migration-scope.outputs.scoped_staff_handoff == 'true' }}
        run: |
          echo "Exact added migrations 173–175 source-contract checks only; real SQL rollback compilation and authenticated runtime validation remain separate release evidence."
          node --test tests/staff-roles-sales-handoff-migrations.test.mjs

      - name: Test migration boundary
        if: ${{ steps.migration-scope.outputs.scoped_chat_mute != 'true' && steps.migration-scope.outputs.scoped_staff_handoff != 'true' && steps.migration-scope.outputs.scoped_retired_slot != 'true' && steps.migration-scope.outputs.scoped_docs_intake != 'true' && steps.migration-scope.outputs.scoped_student_intake != 'true' && steps.migration-scope.outputs.scoped_student_conflicts != 'true' && steps.migration-scope.outputs.scoped_invite_conflicts != 'true' }}
        run: npm run test:database:migration-boundaries

      - name: Check scoped Docs intake source boundary
        if: ${{ steps.migration-scope.outputs.scoped_docs_intake == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const sql = readFileSync('supabase/migrations/176_platform_docs_student_intake.sql', 'utf8');
          assert.match(sql, /^BEGIN;/m);
          assert.match(sql, /COMMIT;\s*$/);
          assert.match(sql, /SECURITY DEFINER/i);
          assert.match(sql, /REVOKE ALL ON FUNCTION/i);
          assert.doesNotMatch(sql, /DISABLE\s+(?:ROW LEVEL SECURITY|TRIGGER)|session_replication_role|ALTER\s+TABLE\s+auth\./i);
          console.log('Exact176 source boundary only; actual SQL compilation and rolled-back staff command proof are separate release evidence.');
          NODE

      - name: Check scoped public Student intake source boundary
        if: ${{ steps.migration-scope.outputs.scoped_student_intake == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const path = 'supabase/migrations/177_platform_public_student_applications.sql';
          const sql = readFileSync(path, 'utf8');
          const evidence = JSON.parse(readFileSync('docs/qa/student-public-onboarding-177-local-2026-09-18.json', 'utf8'));
          assert.match(sql, /^BEGIN;/m);
          assert.match(sql, /COMMIT;\s*$/);
          assert.match(sql, /SECURITY DEFINER/i);
          assert.match(sql, /REVOKE ALL ON FUNCTION/i);
          assert.doesNotMatch(sql, /DISABLE\s+(?:ROW LEVEL SECURITY|TRIGGER)|session_replication_role|ALTER\s+TABLE\s+auth\./i);
          assert.equal(createHash('sha256').update(sql).digest('hex'), evidence.browserEvidence.sourceSha256[path]);
          assert.equal(createHash('sha256').update(sql).digest('hex'), evidence.finalMigrationRollbackCompile.migrationSha256);
          assert.equal(evidence.finalMigrationRollbackCompile.baseMigration, '176');
          assert.equal(evidence.finalMigrationRollbackCompile.compiledMigration, '177');
          console.log('Exact177 source boundary and recorded source hash only; real SQL rollback compilation and Auth/RPC/UI evidence remain separately recorded.');
          NODE

      - name: Check scoped Student conflict source and evidence binding
        if: ${{ steps.migration-scope.outputs.scoped_student_conflicts == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const sql = readFileSync('supabase/migrations/178_platform_student_application_conflict_codes.sql', 'utf8');
          const receipt = readFileSync('docs/qa/student-signup-conflict-178-2026-09-18.md', 'utf8');
          const blocks = [...receipt.matchAll(/^```json\r?\n([\s\S]*?)^```[ \t]*$/gm)];
          assert.equal(blocks.length, 1, 'Expected exactly one JSON evidence block');
          const evidence = JSON.parse(blocks[0][1]);
          assert.equal(createHash('sha256').update(sql).digest('hex'), evidence.migrationSha256);
          assert.equal(evidence.productionRollbackCompile.functions, 2);
          assert.equal(evidence.productionRollbackCompile.authorityUnchanged, true);
          assert.equal(evidence.productionRollbackCompile.onlyCodesChanged, true);
          assert.equal(evidence.localAuthenticatedRpc.status, 409);
          assert.equal(evidence.localAuthenticatedRpc.code, 'PT409');
          assert.equal(evidence.localAuthenticatedRpc.stateUnchanged, true);
          console.log('Exact added178 source/evidence binding only; CI did not execute SQL or authenticated RPC. Real rollback compilation and local RPC results are separately recorded.');
          NODE

      - name: Check scoped invite conflict source and evidence binding
        if: ${{ steps.migration-scope.outputs.scoped_invite_conflicts == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const sql = readFileSync('supabase/migrations/186_platform_student_invite_conflict_codes.sql', 'utf8');
          const receipt = readFileSync('docs/qa/portal-identity-conflict-186-2026-09-19.md', 'utf8');
          const blocks = [...receipt.matchAll(/^```json\r?\n([\s\S]*?)^```[ \t]*$/gm)];
          assert.equal(blocks.length, 1, 'Expected exactly one JSON evidence block');
          const evidence = JSON.parse(blocks[0][1]);
          assert.equal(createHash('sha256').update(sql).digest('hex'), evidence.migrationSha256);
          assert.equal(evidence.productionRollbackCompile.functions, 2);
          for (const key of ['authorityUnchanged', 'onlyCodesChanged', 'rolledBack', 'readbackRestored']) {
            assert.equal(evidence.productionRollbackCompile[key], true, key);
          }
          assert.equal(evidence.productionSqlConflict.code, 'PT409');
          assert.equal(evidence.productionSqlConflict.message, 'portal_identity_conflict');
          assert.equal(evidence.productionSqlConflict.existingIdentity, true);
          assert.equal(evidence.productionSqlConflict.stateUnchanged, true);
          console.log('Exact added186 source/evidence binding only; CI did not execute production SQL or HTTP. Real rollback SQL proof is separately recorded; HTTP/UI/release evidence follows deployment.');
          NODE

      - name: Check retired unused migration slot
        if: ${{ steps.migration-scope.outputs.scoped_retired_slot == 'true' }}
        run: node --test tests/staff-roles-sales-handoff-migrations.test.mjs

  # Isolated dependency verification; no deployment or provider credentials.
  lead_agent_dependencies:
    name: Lead-agent dependency maintenance
    needs: changed-range
    if: ${{ needs.changed-range.outputs.lead_agent_dependencies == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: python:3.13-slim@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    defaults:
      run:
        working-directory: evo-lead-agent
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install production uv version
        run: python -m pip install --no-cache-dir uv==0.11.7

      - name: Install locked production dependencies
        run: uv sync --locked --no-dev

      - name: Check installed dependency compatibility
        run: uv pip check

      - name: Exercise real local lead-agent HTTP runtime
        run: uv run --locked --no-dev python ../scripts/smoke-lead-agent-dependencies.py

  # Source-only maintenance of a retired companion; no deployment or credentials.
  inbox_dependencies:
    name: Inbox dependency maintenance
    needs: changed-range
    if: ${{ (needs.changed-range.outputs.inbox_dependencies == 'true' || needs.changed-range.outputs.inbox_formatting == 'true') && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-lead2-inbox
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      FORMAT_BASE_SHA: ${{ needs.changed-range.outputs.format_base_sha }}
      FORMAT_HEAD_SHA: ${{ needs.changed-range.outputs.format_head_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.changed-range.outputs.format_head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: agent-lead2-inbox/package-lock.json

      - name: Reject unsafe Inbox formatting scope before dependency installation
        if: ${{ needs.changed-range.outputs.inbox_formatting == 'true' }}
        run: node ../scripts/verify-inbox-format.mjs --base "$FORMAT_BASE_SHA" --head "$FORMAT_HEAD_SHA" --scope-only

      - name: Install locked Inbox dependencies
        run: npm ci --ignore-scripts

      - name: Prove exact output of the unchanged locked formatter
        if: ${{ needs.changed-range.outputs.inbox_formatting == 'true' }}
        run: node ../scripts/verify-inbox-format.mjs --base "$FORMAT_BASE_SHA" --head "$FORMAT_HEAD_SHA"

      - name: Check the complete Inbox formatting baseline
        if: ${{ needs.changed-range.outputs.inbox_formatting == 'true' }}
        run: npm run format:check

      - name: Audit all installed Inbox dependencies
        run: npm audit --audit-level=low

      - name: Exercise formatter proof with actual Git and locked Prettier
        run: node --test ../tests/inbox-format-verifier.test.mjs

      - name: Typecheck Inbox
        run: npm run typecheck

      - name: Lint Inbox
        run: npm run lint

      - name: Test pure Inbox helpers without provider adapters
        if: ${{ needs.changed-range.outputs.inbox_formatting != 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import { startVitest } from "vitest/node";
          const files = [
            "src/lib/themes.test.ts",
            "src/lib/whatsapp/template-status-normalize.test.ts",
            "src/lib/ai/chunk.test.ts",
          ];
          let context;
          try {
            context = await startVitest("test", files,
              { config: false, watch: false, include: files },
              { configFile: false, envDir: false });
            if (Object.keys(context.config.env ?? {}).length !== 0) {
              throw new Error("Pure helper tests must not inject environment values");
            }
            const modules = context.state.getTestModules();
            if (modules.length !== files.length || modules.some((module) => !module.ok())
              || context.state.getUnhandledErrors().length > 0) {
              process.exitCode = 1;
            }
          } finally {
            await context?.close();
          }
          NODE

      # Existing offline unit suite (uses its original mocks); not provider proof.
      - name: Run legacy Inbox tests for the formatter baseline
        if: ${{ needs.changed-range.outputs.inbox_formatting == 'true' }}
        run: npm test

      - name: Build Inbox with TypeScript authority
        run: npm run build

  fast-checks:
    name: Fast checks
    if: ${{ always() }}
    needs:
      - changed-range
      - contracts
      - lint
      - build
      - migration_boundary
      - inbox_dependencies
      - lead_agent_dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Require selected fast PR checks
        env:
          RANGE_RESULT: ${{ needs.changed-range.result }}
          HAS_CHANGES: ${{ needs.changed-range.outputs.has_changes }}
          UNKNOWN: ${{ needs.changed-range.outputs.unknown }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MIGRATION_BOUNDARY_RESULT: ${{ needs.migration_boundary.result }}
          LEAD_AGENT_DEPENDENCIES_REQUIRED: ${{ needs.changed-range.outputs.lead_agent_dependencies }}
          LEAD_AGENT_DEPENDENCIES_RESULT: ${{ needs.lead_agent_dependencies.result }}
          INBOX_DEPENDENCIES_REQUIRED: ${{ needs.changed-range.outputs.inbox_dependencies }}
          INBOX_DEPENDENCIES_RESULT: ${{ needs.inbox_dependencies.result }}
          INBOX_FORMATTING_REQUIRED: ${{ needs.changed-range.outputs.inbox_formatting }}
        run: |
          set -Eeuo pipefail
          test "$RANGE_RESULT" = "success"
          test "$HAS_CHANGES" = "true"
          test "$UNKNOWN" = "false"
          case "$INBOX_DEPENDENCIES_REQUIRED:$INBOX_FORMATTING_REQUIRED" in
            true:true|true:false|false:true) test "$INBOX_DEPENDENCIES_RESULT" = "success" ;;
            false:false) test "$INBOX_DEPENDENCIES_RESULT" = "skipped" ;;
            *) exit 1 ;;
          esac
          case "$LEAD_AGENT_DEPENDENCIES_REQUIRED" in
            true) test "$LEAD_AGENT_DEPENDENCIES_RESULT" = "success" ;;
            false) test "$LEAD_AGENT_DEPENDENCIES_RESULT" = "skipped" ;;
            *) exit 1 ;;
          esac
          for result in "$CONTRACTS_RESULT" "$LINT_RESULT" "$BUILD_RESULT" "$MIGRATION_BOUNDARY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A selected fast PR check failed or was cancelled"
                exit 1
                ;;
            esac
          done
