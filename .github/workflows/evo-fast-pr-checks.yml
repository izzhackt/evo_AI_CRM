name: EVO fast PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evo-fast-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-range:
    name: Changed range
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.classify.outputs.has_changes }}
      ordinary_docs: ${{ steps.classify.outputs.ordinary_docs }}
      contracts: ${{ steps.classify.outputs.contracts }}
      migration_boundary: ${{ steps.classify.outputs.migration_boundary }}
      code: ${{ steps.classify.outputs.code }}
      lint: ${{ steps.classify.outputs.lint }}
      build: ${{ steps.classify.outputs.build }}
      inbox_dependencies: ${{ steps.classify.outputs.inbox_dependencies }}
      unknown: ${{ steps.classify.outputs.unknown }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refresh the main release baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Reject whitespace errors in the complete release diff
        run: git diff --check origin/main...HEAD

      - name: Classify PR changes
        id: classify
        env:
          BASE_SHA: origin/main
          HEAD_SHA: HEAD
        run: |
          set -Eeuo pipefail
          node scripts/classify-pr-changes.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Validate classifier outputs
        env:
          HAS_CHANGES: ${{ steps.classify.outputs.has_changes }}
          ORDINARY_DOCS: ${{ steps.classify.outputs.ordinary_docs }}
          CONTRACTS: ${{ steps.classify.outputs.contracts }}
          MIGRATION_BOUNDARY: ${{ steps.classify.outputs.migration_boundary }}
          CODE: ${{ steps.classify.outputs.code }}
          LINT: ${{ steps.classify.outputs.lint }}
          BUILD: ${{ steps.classify.outputs.build }}
          INBOX_DEPENDENCIES: ${{ steps.classify.outputs.inbox_dependencies }}
          UNKNOWN: ${{ steps.classify.outputs.unknown }}
        run: |
          set -Eeuo pipefail
          for value in "$HAS_CHANGES" "$ORDINARY_DOCS" "$CONTRACTS" "$MIGRATION_BOUNDARY" "$CODE" "$LINT" "$BUILD" "$INBOX_DEPENDENCIES" "$UNKNOWN"; do
            case "$value" in
              true|false) ;;
              *)
                echo "::error::PR classifier returned an invalid boolean output"
                exit 1
                ;;
            esac
          done

  contracts:
    name: Release contracts
    needs: changed-range
    if: ${{ needs.changed-range.outputs.contracts == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test release contracts
        run: npm run test:fast-release

  lint:
    name: Lint
    needs: changed-range
    if: ${{ needs.changed-range.outputs.lint == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build:
    name: Build
    needs: changed-range
    if: ${{ needs.changed-range.outputs.build == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build with TypeScript authority
        run: npm run build

  migration_boundary:
    name: Migration boundary
    needs: changed-range
    if: ${{ needs.changed-range.outputs.migration_boundary == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Test migration boundary
        run: npm run test:database:migration-boundaries

  # Source-only maintenance of a retired companion; no deployment or credentials.
  inbox_dependencies:
    name: Inbox dependency maintenance
    needs: changed-range
    if: ${{ needs.changed-range.outputs.inbox_dependencies == 'true' && needs.changed-range.outputs.unknown != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-lead2-inbox
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: agent-lead2-inbox/package-lock.json

      - name: Install locked Inbox dependencies
        run: npm ci --ignore-scripts

      - name: Audit all installed Inbox dependencies
        run: npm audit --audit-level=low

      - name: Typecheck Inbox
        run: npm run typecheck

      - name: Lint Inbox
        run: npm run lint

      - name: Test pure Inbox helpers without provider adapters
        run: |
          node --input-type=module <<'NODE'
          import { startVitest } from "vitest/node";
          const files = [
            "src/lib/themes.test.ts",
            "src/lib/whatsapp/template-status-normalize.test.ts",
            "src/lib/ai/chunk.test.ts",
          ];
          let context;
          try {
            context = await startVitest("test", files,
              { config: false, watch: false, include: files },
              { configFile: false, envFile: false });
            if (Object.keys(context.config.env).length !== 0) {
              throw new Error("Pure helper tests must not inject environment values");
            }
            const modules = context.state.getTestModules();
            if (modules.length !== files.length || modules.some((module) => !module.ok())
              || context.state.getUnhandledErrors().length > 0) {
              process.exitCode = 1;
            }
          } finally {
            await context?.close();
          }
          NODE

      - name: Build Inbox with TypeScript authority
        run: npm run build

  fast-checks:
    name: Fast checks
    if: ${{ always() }}
    needs:
      - changed-range
      - contracts
      - lint
      - build
      - migration_boundary
      - inbox_dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Require selected fast PR checks
        env:
          RANGE_RESULT: ${{ needs.changed-range.result }}
          HAS_CHANGES: ${{ needs.changed-range.outputs.has_changes }}
          UNKNOWN: ${{ needs.changed-range.outputs.unknown }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MIGRATION_BOUNDARY_RESULT: ${{ needs.migration_boundary.result }}
          INBOX_DEPENDENCIES_REQUIRED: ${{ needs.changed-range.outputs.inbox_dependencies }}
          INBOX_DEPENDENCIES_RESULT: ${{ needs.inbox_dependencies.result }}
        run: |
          set -Eeuo pipefail
          test "$RANGE_RESULT" = "success"
          test "$HAS_CHANGES" = "true"
          test "$UNKNOWN" = "false"
          case "$INBOX_DEPENDENCIES_REQUIRED" in
            true) test "$INBOX_DEPENDENCIES_RESULT" = "success" ;;
            false) test "$INBOX_DEPENDENCIES_RESULT" = "skipped" ;;
            *) exit 1 ;;
          esac
          for result in "$CONTRACTS_RESULT" "$LINT_RESULT" "$BUILD_RESULT" "$MIGRATION_BOUNDARY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A selected fast PR check failed or was cancelled"
                exit 1
                ;;
            esac
          done
