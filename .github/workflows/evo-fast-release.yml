name: EVO production release

on:
  workflow_run:
    workflows:
      - EVO platform CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  group: evo-production-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and build immutable CRM image
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.EVO_AUTOMATED_PRODUCTION_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the CI-approved immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up the repository Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Require exact current main and exact-SHA green CI
        env:
          EVO_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
          EVO_RELEASE_WORKFLOW_REVISION: ${{ github.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EVO_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVO_RELEASE_WORKFLOW_REVISION" == "$EVO_RELEASE_REVISION" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$EVO_RELEASE_REVISION" ]]
          [[ "$(git rev-parse origin/main)" == "$EVO_RELEASE_REVISION" ]]
          node scripts/fast-release-ci-gate.mjs

      - name: Build the exact linux-amd64 CRM image and archive
        env:
          EVO_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
          EVO_RELEASE_WORKFLOW_REVISION: ${{ github.workflow_sha }}
          EVO_IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -Eeuo pipefail
          short_revision=${EVO_RELEASE_REVISION:0:8}
          EVO_RELEASE_VERSION="r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${short_revision}"
          export EVO_RELEASE_VERSION
          docker build \
            --platform linux/amd64 \
            --build-arg "EVO_IMAGE_SOURCE=$EVO_IMAGE_SOURCE" \
            --build-arg "EVO_IMAGE_REVISION=$EVO_RELEASE_REVISION" \
            --build-arg "EVO_IMAGE_VERSION=$EVO_RELEASE_VERSION" \
            --tag "evo-crm:$EVO_RELEASE_REVISION" \
            .
          image_id=$(docker image inspect --format '{{.Id}}' "evo-crm:$EVO_RELEASE_REVISION")
          image_os=$(docker image inspect --format '{{.Os}}' "evo-crm:$EVO_RELEASE_REVISION")
          image_arch=$(docker image inspect --format '{{.Architecture}}' "evo-crm:$EVO_RELEASE_REVISION")
          image_revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "evo-crm:$EVO_RELEASE_REVISION")
          image_version=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "evo-crm:$EVO_RELEASE_REVISION")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$image_os" == linux && "$image_arch" == amd64 ]]
          [[ "$image_revision" == "$EVO_RELEASE_REVISION" ]]
          [[ "$image_version" == "$EVO_RELEASE_VERSION" ]]
          docker save "evo-crm:$EVO_RELEASE_REVISION" | gzip -1 > /tmp/evo-crm-image.tar.gz
          archive_sha256=$(sha256sum /tmp/evo-crm-image.tar.gz | awk '{print $1}')
          compose_sha256=$(sha256sum docker-compose.prod.yml | awk '{print $1}')
          [[ "$EVO_RELEASE_WORKFLOW_REVISION" == "$EVO_RELEASE_REVISION" ]]
          for source_file in \
            scripts/evo-fast-release.sh \
            scripts/evo-app-env-contract.mjs \
            deploy/env.production.example; do
            [[ -f "$source_file" && ! -L "$source_file" ]]
          done
          install -m 700 scripts/evo-fast-release.sh /tmp/evo-fast-release.sh
          install -m 600 scripts/evo-app-env-contract.mjs /tmp/evo-app-env-contract.mjs
          install -m 600 deploy/env.production.example /tmp/env.production.example
          controller_sha256=$(sha256sum /tmp/evo-fast-release.sh | awk '{print $1}')
          validator_sha256=$(sha256sum /tmp/evo-app-env-contract.mjs | awk '{print $1}')
          env_example_sha256=$(sha256sum /tmp/env.production.example | awk '{print $1}')
          jq -cn \
            --arg revision "$EVO_RELEASE_REVISION" \
            --arg workflowRevision "$EVO_RELEASE_WORKFLOW_REVISION" \
            --arg imageId "$image_id" \
            --arg archiveSha256 "$archive_sha256" \
            --arg composeSha256 "$compose_sha256" \
            --arg controllerSha256 "$controller_sha256" \
            --arg validatorSha256 "$validator_sha256" \
            --arg envExampleSha256 "$env_example_sha256" \
            --arg version "$EVO_RELEASE_VERSION" \
            '{revision:$revision,workflowRevision:$workflowRevision,imageId:$imageId,archiveSha256:$archiveSha256,composeSha256:$composeSha256,controllerSha256:$controllerSha256,validatorSha256:$validatorSha256,envExampleSha256:$envExampleSha256,version:$version,os:"linux",architecture:"amd64"}' \
            > /tmp/evo-production-release-image.json

      - name: Seal the production candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evo-production-candidate-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            /tmp/evo-crm-image.tar.gz
            /tmp/evo-production-release-image.json
            /tmp/evo-fast-release.sh
            /tmp/evo-app-env-contract.mjs
            /tmp/env.production.example

  release:
    name: Deploy and verify CRM app
    if: >-
      needs.prepare.result == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.EVO_AUTOMATED_PRODUCTION_RELEASE_ENABLED == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the CI-approved immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up the repository Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Require exact current main and exact-SHA green CI
        env:
          EVO_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
          EVO_RELEASE_WORKFLOW_REVISION: ${{ github.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EVO_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVO_RELEASE_WORKFLOW_REVISION" == "$EVO_RELEASE_REVISION" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$EVO_RELEASE_REVISION" ]]
          [[ "$(git rev-parse origin/main)" == "$EVO_RELEASE_REVISION" ]]
          node scripts/fast-release-ci-gate.mjs

      - name: Download the sealed production candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evo-production-candidate-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
          path: /tmp/evo-production-candidate

      - name: Revalidate the sealed production candidate
        env:
          EVO_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
          EVO_RELEASE_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -Eeuo pipefail
          metadata=/tmp/evo-production-candidate/evo-production-release-image.json
          archive=/tmp/evo-production-candidate/evo-crm-image.tar.gz
          controller=/tmp/evo-production-candidate/evo-fast-release.sh
          validator=/tmp/evo-production-candidate/evo-app-env-contract.mjs
          env_example=/tmp/evo-production-candidate/env.production.example
          [[ -f "$metadata" && ! -L "$metadata" ]]
          [[ -f "$archive" && ! -L "$archive" ]]
          [[ -f "$controller" && ! -L "$controller" ]]
          [[ -f "$validator" && ! -L "$validator" ]]
          [[ -f "$env_example" && ! -L "$env_example" ]]
          [[ "$(jq -er '.revision' "$metadata")" == "$EVO_RELEASE_REVISION" ]]
          [[ "$(jq -er '.workflowRevision' "$metadata")" == "$EVO_RELEASE_WORKFLOW_REVISION" ]]
          [[ "$(jq -er '.imageId' "$metadata")" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(jq -er '.version' "$metadata")" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]
          [[ "$(jq -er '.os' "$metadata")" == linux ]]
          [[ "$(jq -er '.architecture' "$metadata")" == amd64 ]]
          [[ "$(sha256sum "$archive" | awk '{print $1}')" == "$(jq -er '.archiveSha256' "$metadata")" ]]
          [[ "$(sha256sum docker-compose.prod.yml | awk '{print $1}')" == "$(jq -er '.composeSha256' "$metadata")" ]]
          [[ "$(sha256sum "$controller" | awk '{print $1}')" == "$(jq -er '.controllerSha256' "$metadata")" ]]
          [[ "$(sha256sum "$validator" | awk '{print $1}')" == "$(jq -er '.validatorSha256' "$metadata")" ]]
          [[ "$(sha256sum "$env_example" | awk '{print $1}')" == "$(jq -er '.envExampleSha256' "$metadata")" ]]
          [[ "$(sha256sum scripts/evo-fast-release.sh | awk '{print $1}')" == "$(jq -er '.controllerSha256' "$metadata")" ]]
          [[ "$(sha256sum scripts/evo-app-env-contract.mjs | awk '{print $1}')" == "$(jq -er '.validatorSha256' "$metadata")" ]]
          [[ "$(sha256sum deploy/env.production.example | awk '{print $1}')" == "$(jq -er '.envExampleSha256' "$metadata")" ]]
          chmod 700 "$controller"
          install -m 600 "$metadata" /tmp/evo-production-release-image.json

      - name: Configure pinned SSH trust
        env:
          DEPLOY_HOST: ${{ vars.EVO_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.EVO_DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.EVO_DEPLOY_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.EVO_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.EVO_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ -n "$DEPLOY_PRIVATE_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/evo_deploy"
          install -m 600 /dev/null "$HOME/.ssh/evo_known_hosts"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/evo_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/evo_known_hosts"
          {
            printf 'Host evo-production\n'
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  Port %s\n' "$DEPLOY_PORT"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  IdentityFile %s/.ssh/evo_deploy\n' "$HOME"
            printf '  UserKnownHostsFile %s/.ssh/evo_known_hosts\n' "$HOME"
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  BatchMode yes\n'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh evo-production true

      - name: Validate the production release contract names
        env:
          EVO_RELEASE_ROOT: ${{ vars.EVO_RELEASE_ROOT }}
          EVO_RELEASE_PROJECT_NAME: ${{ vars.EVO_RELEASE_PROJECT_NAME }}
          EVO_RELEASE_TRANSFER_ROOT: ${{ vars.EVO_RELEASE_TRANSFER_ROOT }}
          EVO_RELEASE_EVIDENCE_ROOT: ${{ vars.EVO_RELEASE_EVIDENCE_ROOT }}
          EVO_RELEASE_ROLLBACK_SEED: ${{ vars.EVO_RELEASE_ROLLBACK_SEED }}
          EVO_RELEASE_EXTERNAL_HEALTH_URL: ${{ vars.EVO_RELEASE_EXTERNAL_HEALTH_URL }}
          EVO_RELEASE_MIN_FREE_KB: ${{ vars.EVO_RELEASE_MIN_FREE_KB }}
          EVO_WAHA_IMAGE_DIGEST: ${{ vars.EVO_WAHA_IMAGE_DIGEST }}
          EVO_SUPABASE_PROJECT_REF: ${{ vars.EVO_SUPABASE_PROJECT_REF }}
        run: |
          set -Eeuo pipefail
          [[ "$EVO_RELEASE_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$EVO_RELEASE_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9_-]{0,99}$ ]]
          [[ "$EVO_RELEASE_TRANSFER_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$EVO_RELEASE_EVIDENCE_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$EVO_RELEASE_ROLLBACK_SEED" =~ ^/[A-Za-z0-9._/-]+/state\.json$ ]]
          [[ "$EVO_RELEASE_EXTERNAL_HEALTH_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/api/health$ ]]
          [[ "$EVO_RELEASE_MIN_FREE_KB" =~ ^[0-9]+$ ]]
          (( EVO_RELEASE_MIN_FREE_KB >= 1048576 ))
          [[ "$EVO_WAHA_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EVO_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          for path in "$EVO_RELEASE_ROOT" "$EVO_RELEASE_TRANSFER_ROOT" "$EVO_RELEASE_EVIDENCE_ROOT" "$EVO_RELEASE_ROLLBACK_SEED"; do
            [[ "$path" != / && "$path" != *//* && "$path" != */../* && "$path" != */.. && "$path" != */./* && "$path" != */. ]]
          done

      - name: Verify the production migration ledger without mutation
        env:
          EVO_RELEASE_REPO: ${{ github.workspace }}
          EVO_SUPABASE_PROJECT_REF: ${{ vars.EVO_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]]
          node scripts/fast-release-ledger-gate.mjs > /tmp/evo-production-release-ledger.json

      - name: Transfer the immutable release bundle to Hermes
        env:
          EVO_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
          EVO_RELEASE_TRANSFER_ROOT: ${{ vars.EVO_RELEASE_TRANSFER_ROOT }}
        run: |
          set -Eeuo pipefail
          [[ "$EVO_RELEASE_TRANSFER_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          run_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          transfer_dir="$EVO_RELEASE_TRANSFER_ROOT/${EVO_RELEASE_REVISION}-${run_id}"
          ssh evo-production bash -s -- "$transfer_dir" <<'REMOTE'
          set -Eeuo pipefail
          transfer_dir=$1
          [[ "$transfer_dir" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ ! -e "$transfer_dir" ]]
          install -d -m 700 "$transfer_dir"
          REMOTE
          printf '%s\n' "$transfer_dir" > /tmp/evo-production-release-transfer-dir
          chmod 600 /tmp/evo-production-release-transfer-dir
          scp \
            /tmp/evo-production-candidate/evo-crm-image.tar.gz \
            /tmp/evo-production-candidate/evo-fast-release.sh \
            /tmp/evo-production-candidate/evo-app-env-contract.mjs \
            /tmp/evo-production-candidate/env.production.example \
            "evo-production:$transfer_dir/"

      - name: Reconfirm exact main and exact-SHA CI immediately before deployment
        env:
          EVO_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
          EVO_RELEASE_WORKFLOW_REVISION: ${{ github.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EVO_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVO_RELEASE_WORKFLOW_REVISION" == "$EVO_RELEASE_REVISION" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$EVO_RELEASE_REVISION" ]]
          [[ "$(git rev-parse origin/main)" == "$EVO_RELEASE_REVISION" ]]
          node scripts/fast-release-ci-gate.mjs

      - name: Run one preflight, deploy app, verify, and auto-rollback on failure
        env:
          EVO_RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
          EVO_RELEASE_ROOT: ${{ vars.EVO_RELEASE_ROOT }}
          EVO_RELEASE_PROJECT_NAME: ${{ vars.EVO_RELEASE_PROJECT_NAME }}
          EVO_RELEASE_TRANSFER_ROOT: ${{ vars.EVO_RELEASE_TRANSFER_ROOT }}
          EVO_RELEASE_EVIDENCE_ROOT: ${{ vars.EVO_RELEASE_EVIDENCE_ROOT }}
          EVO_RELEASE_ROLLBACK_SEED: ${{ vars.EVO_RELEASE_ROLLBACK_SEED }}
          EVO_RELEASE_EXTERNAL_HEALTH_URL: ${{ vars.EVO_RELEASE_EXTERNAL_HEALTH_URL }}
          EVO_RELEASE_MIN_FREE_KB: ${{ vars.EVO_RELEASE_MIN_FREE_KB }}
          EVO_WAHA_IMAGE_DIGEST: ${{ vars.EVO_WAHA_IMAGE_DIGEST }}
        run: |
          set -Eeuo pipefail
          transfer_dir=$(cat /tmp/evo-production-release-transfer-dir)
          image_id=$(jq -er '.imageId' /tmp/evo-production-release-image.json)
          archive_sha256=$(jq -er '.archiveSha256' /tmp/evo-production-release-image.json)
          compose_sha256=$(jq -er '.composeSha256' /tmp/evo-production-release-image.json)
          controller_sha256=$(jq -er '.controllerSha256' /tmp/evo-production-release-image.json)
          validator_sha256=$(jq -er '.validatorSha256' /tmp/evo-production-release-image.json)
          env_example_sha256=$(jq -er '.envExampleSha256' /tmp/evo-production-release-image.json)
          release_version=$(jq -er '.version' /tmp/evo-production-release-image.json)
          run_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          ssh evo-production bash -s -- \
            "$transfer_dir" \
            "$EVO_RELEASE_TRANSFER_ROOT" \
            "$controller_sha256" \
            "$validator_sha256" \
            "$env_example_sha256" \
            "$EVO_RELEASE_ROOT" \
            "$EVO_RELEASE_PROJECT_NAME" \
            "$EVO_RELEASE_EVIDENCE_ROOT" \
            "$EVO_RELEASE_ROLLBACK_SEED" \
            "$EVO_RELEASE_EXTERNAL_HEALTH_URL" \
            "$EVO_RELEASE_MIN_FREE_KB" \
            "$EVO_WAHA_IMAGE_DIGEST" \
            "$EVO_RELEASE_REVISION" \
            "$release_version" \
            "$run_id" \
            "$archive_sha256" \
            "$image_id" \
            "$compose_sha256" <<'REMOTE' \
            > /tmp/evo-production-release-result-line.json \
            2> /tmp/evo-production-release-controller-error.log
          set -Eeuo pipefail
          transfer_dir=$1
          transfer_root=$2
          controller="$transfer_dir/evo-fast-release.sh"
          validator="$transfer_dir/evo-app-env-contract.mjs"
          env_example="$transfer_dir/env.production.example"
          archive="$transfer_dir/evo-crm-image.tar.gz"
          [[ "$transfer_dir" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$transfer_root" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$transfer_dir" == "$transfer_root/"* ]]
          for bundle_file in "$archive" "$controller" "$validator" "$env_example"; do
            [[ -f "$bundle_file" && ! -L "$bundle_file" ]]
          done
          [[ "$(sha256sum "$archive" | awk '{print $1}')" == "${16}" ]]
          [[ "$(sha256sum "$controller" | awk '{print $1}')" == "$3" ]]
          [[ "$(sha256sum "$validator" | awk '{print $1}')" == "$4" ]]
          [[ "$(sha256sum "$env_example" | awk '{print $1}')" == "$5" ]]
          chmod 700 "$controller"
          export EVO_RELEASE_ROOT=$6
          export EVO_RELEASE_PROJECT_NAME=$7
          export EVO_RELEASE_TRANSFER_ROOT=$2
          export EVO_RELEASE_EVIDENCE_ROOT=$8
          export EVO_RELEASE_ROLLBACK_SEED=$9
          export EVO_RELEASE_COMPOSE_FILE="$6/docker-compose.prod.yml"
          export EVO_RELEASE_ACTIVE_COMPOSE_FILE="$6/docker-compose.prod.yml"
          export EVO_RELEASE_APP_ENV_FILE="$6/.env.production"
          export EVO_RELEASE_ENV_EXAMPLE_FILE="$env_example"
          export EVO_RELEASE_EXTERNAL_HEALTH_URL=${10}
          export EVO_RELEASE_MIN_FREE_KB=${11}
          export EVO_WAHA_IMAGE_DIGEST=${12}
          unset EVO_RELEASE_DOCKER_STORAGE_PATH
          export EVO_RELEASE_REVISION=${13}
          export EVO_RELEASE_VERSION=${14}
          export EVO_RELEASE_RUN_ID=${15}
          export EVO_RELEASE_ARCHIVE="$archive"
          export EVO_RELEASE_ARCHIVE_SHA256=${16}
          export EVO_RELEASE_EXPECTED_IMAGE_ID=${17}
          export EVO_RELEASE_EXPECTED_COMPOSE_SHA256=${18}
          exec "$controller" deploy
          REMOTE
          release_status=$?
          set -e
          cat /tmp/evo-production-release-result-line.json
          evidence_dir=$(jq -er '.evidenceDir' /tmp/evo-production-release-result-line.json 2>/dev/null || true)
          if [[ -n "$evidence_dir" ]]; then
            [[ "$evidence_dir" == "$EVO_RELEASE_EVIDENCE_ROOT/"* ]]
            scp "evo-production:$evidence_dir/result.json" /tmp/evo-production-release-result.json
          else
            failure_code=$(jq -Rr \
              'fromjson? | select(.ok == false) | .code // empty' \
              /tmp/evo-production-release-controller-error.log | tail -n 1)
            if [[ ! "$failure_code" =~ ^[a-z0-9_]{1,64}$ ]]; then
              if [[ $release_status == 255 ]]; then
                failure_code=transport_failed
              elif [[ $release_status == 0 || $release_status == 3 || $release_status == 4 ]]; then
                failure_code=evidence_missing
                release_status=2
              else
                failure_code=controller_failed
              fi
            fi
            jq -cn \
              --arg code "$failure_code" \
              --arg revision "$EVO_RELEASE_REVISION" \
              --arg version "$release_version" \
              --arg image "$image_id" \
              '{schema:"evo-fast-release/v1",status:"blocked",code:$code,phase:"preflight_or_load",revision:$revision,version:$version,image:$image,rolledBack:false}' \
              > /tmp/evo-production-release-result.json
            chmod 600 /tmp/evo-production-release-result.json
            cat /tmp/evo-production-release-result.json
          fi
          exit "$release_status"

      - name: Remove the transferred release bundle
        if: always()
        env:
          EVO_RELEASE_TRANSFER_ROOT: ${{ vars.EVO_RELEASE_TRANSFER_ROOT }}
        run: |
          set -Eeuo pipefail
          [[ -f /tmp/evo-production-release-transfer-dir ]] || exit 0
          transfer_dir=$(cat /tmp/evo-production-release-transfer-dir)
          [[ "$EVO_RELEASE_TRANSFER_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$transfer_dir" == "$EVO_RELEASE_TRANSFER_ROOT/"* ]]
          ssh evo-production bash -s -- "$transfer_dir" "$EVO_RELEASE_TRANSFER_ROOT" <<'REMOTE'
          set -Eeuo pipefail
          transfer_dir=$1
          transfer_root=$2
          [[ "$transfer_dir" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$transfer_root" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$transfer_dir" == "$transfer_root/"* ]]
          [[ -d "$transfer_dir" && ! -L "$transfer_dir" ]]
          for file_name in \
            evo-crm-image.tar.gz \
            evo-fast-release.sh \
            evo-app-env-contract.mjs \
            env.production.example; do
            transferred_file="$transfer_dir/$file_name"
            [[ "$transferred_file" == "$transfer_dir/"* ]]
            if [[ -e "$transferred_file" || -L "$transferred_file" ]]; then
              [[ ! -d "$transferred_file" || -L "$transferred_file" ]]
              rm -f -- "$transferred_file"
            fi
          done
          rmdir -- "$transfer_dir"
          REMOTE

      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evo-production-release-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/evo-production-release-ledger.json
            /tmp/evo-production-release-image.json
            /tmp/evo-production-release-result.json

      - name: Remove the ephemeral deploy key
        if: always()
        run: rm -f "$HOME/.ssh/evo_deploy" "$HOME/.ssh/evo_known_hosts" "$HOME/.ssh/config"
