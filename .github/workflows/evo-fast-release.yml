name: EVO fast app release

on:
  workflow_dispatch:
    inputs:
      release_revision:
        description: Exact current main commit SHA
        required: true
        type: string
      release_environment:
        description: Production fast release or validation-only staging preflight
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  checks: read

concurrency:
  group: evo-${{ inputs.release_environment }}-release
  cancel-in-progress: false

jobs:
  staging_profile_preflight:
    name: Validate the closed staging identity without effects
    if: inputs.release_environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Check out the requested immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_revision }}
          fetch-depth: 0

      - name: Set up the repository Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Require exact current main and exact-SHA green CI
        env:
          EVO_RELEASE_REVISION: ${{ inputs.release_revision }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EVO_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$EVO_RELEASE_REVISION" ]]
          [[ "$(git rev-parse origin/main)" == "$EVO_RELEASE_REVISION" ]]
          node scripts/fast-release-ci-gate.mjs

      - name: Validate the effect-free controlled staging profile
        env:
          EVO_RELEASE_ENVIRONMENT: staging
          EVO_RELEASE_GITHUB_ENVIRONMENT: staging
          EVO_RELEASE_ROOT: /opt/evo-crm-staging
          EVO_RELEASE_IMMUTABLE_ROOT: /opt/evo-crm-staging/releases
          EVO_RELEASE_STAGING_ROOT: /opt/evo-crm-staging/.release-staging
          EVO_RELEASE_EVIDENCE_ROOT: /opt/evo-crm-staging/evidence
          EVO_RELEASE_PROJECT_NAME: evo-crm-staging
          EVO_RELEASE_PRIVATE_NETWORK: evo_crm_staging_private
          EVO_RELEASE_PUBLIC_NETWORK: evo_public_web
          EVO_RELEASE_VOLUME_NAMES: evo_crm_staging_output,evo_crm_staging_waha_sessions
          EVO_RELEASE_PUBLIC_HOSTNAME: staging.crm.evoadmissions.com
          EVO_RELEASE_APP_ENV_FILE: ${{ runner.temp }}/evo-staging-app.env
          EVO_RELEASE_ENV_EXAMPLE_FILE: ${{ github.workspace }}/deploy/env.staging.example
          EVO_RELEASE_STAGING_APP_ENV: ${{ secrets.EVO_RELEASE_STAGING_APP_ENV }}
          EVO_RELEASE_SUPABASE_PROJECT_REF: ${{ vars.EVO_RELEASE_SUPABASE_PROJECT_REF }}
          EVO_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.EVO_PRODUCTION_SUPABASE_PROJECT_REF }}
          EVO_RELEASE_PLATFORM_ORGANIZATION_ID: ${{ vars.EVO_RELEASE_PLATFORM_ORGANIZATION_ID }}
          EVO_RELEASE_SUPABASE_PUBLISHABLE_KEY_SHA256: ${{ vars.EVO_RELEASE_SUPABASE_PUBLISHABLE_KEY_SHA256 }}
          EVO_RELEASE_SUPABASE_SECRET_KEY_SHA256: ${{ vars.EVO_RELEASE_SUPABASE_SECRET_KEY_SHA256 }}
          EVO_PRODUCTION_SUPABASE_PUBLISHABLE_KEY_SHA256: ${{ vars.EVO_PRODUCTION_SUPABASE_PUBLISHABLE_KEY_SHA256 }}
          EVO_PRODUCTION_SUPABASE_SECRET_KEY_SHA256: ${{ vars.EVO_PRODUCTION_SUPABASE_SECRET_KEY_SHA256 }}
        run: |
          set -Eeuo pipefail
          trap 'rm -f -- "$EVO_RELEASE_APP_ENV_FILE"' EXIT
          install -m 600 /dev/null "$EVO_RELEASE_APP_ENV_FILE"
          printf '%s' "$EVO_RELEASE_STAGING_APP_ENV" > "$EVO_RELEASE_APP_ENV_FILE"
          unset EVO_RELEASE_STAGING_APP_ENV
          result_json=$(scripts/evo-fast-release.sh controlled-staging-preflight)
          [[ "$(jq -er '.ok' <<<"$result_json")" == true ]]
          [[ "$(jq -er '.effectsAllowed' <<<"$result_json")" == false ]]
          [[ "$(jq -er '.environment' <<<"$result_json")" == staging ]]
          [[ "$(jq -er '.releaseStatus' <<<"$result_json")" == blocked ]]
          [[ "$(jq -er '.blocker' <<<"$result_json")" == managed_staging_inputs_required ]]
          printf '%s\n' "$result_json" > /tmp/evo-controlled-staging-preflight.json

      - name: Upload the redacted staging preflight result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evo-controlled-staging-preflight-${{ inputs.release_revision }}
          if-no-files-found: error
          retention-days: 30
          path: /tmp/evo-controlled-staging-preflight.json

  prepare:
    name: Validate and build immutable CRM image
    if: inputs.release_environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the requested immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_revision }}
          fetch-depth: 0

      - name: Set up the repository Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Require exact current main and exact-SHA green CI
        env:
          EVO_RELEASE_REVISION: ${{ inputs.release_revision }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EVO_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$EVO_RELEASE_REVISION" ]]
          [[ "$(git rev-parse origin/main)" == "$EVO_RELEASE_REVISION" ]]
          node scripts/fast-release-ci-gate.mjs

      - name: Build the exact linux-amd64 CRM image and archive
        env:
          EVO_RELEASE_REVISION: ${{ inputs.release_revision }}
          EVO_IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -Eeuo pipefail
          short_revision=${EVO_RELEASE_REVISION:0:8}
          EVO_RELEASE_VERSION="r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${short_revision}"
          export EVO_RELEASE_VERSION
          docker build \
            --platform linux/amd64 \
            --build-arg "EVO_IMAGE_SOURCE=$EVO_IMAGE_SOURCE" \
            --build-arg "EVO_IMAGE_REVISION=$EVO_RELEASE_REVISION" \
            --build-arg "EVO_IMAGE_VERSION=$EVO_RELEASE_VERSION" \
            --tag "evo-crm:$EVO_RELEASE_REVISION" \
            .
          image_id=$(docker image inspect --format '{{.Id}}' "evo-crm:$EVO_RELEASE_REVISION")
          image_os=$(docker image inspect --format '{{.Os}}' "evo-crm:$EVO_RELEASE_REVISION")
          image_arch=$(docker image inspect --format '{{.Architecture}}' "evo-crm:$EVO_RELEASE_REVISION")
          image_revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "evo-crm:$EVO_RELEASE_REVISION")
          image_version=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "evo-crm:$EVO_RELEASE_REVISION")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$image_os" == linux && "$image_arch" == amd64 ]]
          [[ "$image_revision" == "$EVO_RELEASE_REVISION" ]]
          [[ "$image_version" == "$EVO_RELEASE_VERSION" ]]
          docker save "evo-crm:$EVO_RELEASE_REVISION" | gzip -1 > /tmp/evo-crm-image.tar.gz
          archive_sha256=$(sha256sum /tmp/evo-crm-image.tar.gz | awk '{print $1}')
          compose_sha256=$(sha256sum docker-compose.prod.yml | awk '{print $1}')
          jq -cn \
            --arg revision "$EVO_RELEASE_REVISION" \
            --arg imageId "$image_id" \
            --arg archiveSha256 "$archive_sha256" \
            --arg composeSha256 "$compose_sha256" \
            --arg version "$EVO_RELEASE_VERSION" \
            '{revision:$revision,imageId:$imageId,archiveSha256:$archiveSha256,composeSha256:$composeSha256,version:$version,os:"linux",architecture:"amd64"}' \
            > /tmp/evo-fast-release-image.json

      - name: Seal the candidate before production approval
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evo-fast-candidate-${{ inputs.release_revision }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            /tmp/evo-crm-image.tar.gz
            /tmp/evo-fast-release-image.json

  release:
    name: Approve, deploy, and verify CRM app
    if: inputs.release_environment == 'production'
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out the requested immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_revision }}
          fetch-depth: 0

      - name: Set up the repository Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Require exact current main and exact-SHA green CI
        env:
          EVO_RELEASE_REVISION: ${{ inputs.release_revision }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EVO_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$EVO_RELEASE_REVISION" ]]
          [[ "$(git rev-parse origin/main)" == "$EVO_RELEASE_REVISION" ]]
          node scripts/fast-release-ci-gate.mjs

      - name: Download the sealed pre-approval candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evo-fast-candidate-${{ inputs.release_revision }}-${{ github.run_attempt }}
          path: /tmp/evo-fast-candidate

      - name: Revalidate the sealed candidate after approval
        env:
          EVO_RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          set -Eeuo pipefail
          metadata=/tmp/evo-fast-candidate/evo-fast-release-image.json
          archive=/tmp/evo-fast-candidate/evo-crm-image.tar.gz
          [[ -f "$metadata" && ! -L "$metadata" ]]
          [[ -f "$archive" && ! -L "$archive" ]]
          [[ "$(jq -er '.revision' "$metadata")" == "$EVO_RELEASE_REVISION" ]]
          [[ "$(jq -er '.imageId' "$metadata")" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(jq -er '.version' "$metadata")" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]
          [[ "$(jq -er '.os' "$metadata")" == linux ]]
          [[ "$(jq -er '.architecture' "$metadata")" == amd64 ]]
          [[ "$(sha256sum "$archive" | awk '{print $1}')" == "$(jq -er '.archiveSha256' "$metadata")" ]]
          [[ "$(sha256sum docker-compose.prod.yml | awk '{print $1}')" == "$(jq -er '.composeSha256' "$metadata")" ]]
          install -m 600 "$metadata" /tmp/evo-fast-release-image.json

      - name: Configure pinned SSH trust
        env:
          DEPLOY_HOST: ${{ vars.EVO_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.EVO_DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.EVO_DEPLOY_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.EVO_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.EVO_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ -n "$DEPLOY_PRIVATE_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/evo_deploy"
          install -m 600 /dev/null "$HOME/.ssh/evo_known_hosts"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/evo_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/evo_known_hosts"
          {
            printf 'Host evo-production\n'
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  Port %s\n' "$DEPLOY_PORT"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  IdentityFile %s/.ssh/evo_deploy\n' "$HOME"
            printf '  UserKnownHostsFile %s/.ssh/evo_known_hosts\n' "$HOME"
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  BatchMode yes\n'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh evo-production true

      - name: Validate the production release contract names
        env:
          EVO_RELEASE_ROOT: ${{ vars.EVO_RELEASE_ROOT }}
          EVO_RELEASE_PROJECT_NAME: ${{ vars.EVO_RELEASE_PROJECT_NAME }}
          EVO_RELEASE_STAGING_ROOT: ${{ vars.EVO_RELEASE_STAGING_ROOT }}
          EVO_RELEASE_EVIDENCE_ROOT: ${{ vars.EVO_RELEASE_EVIDENCE_ROOT }}
          EVO_RELEASE_EXTERNAL_HEALTH_URL: ${{ vars.EVO_RELEASE_EXTERNAL_HEALTH_URL }}
          EVO_RELEASE_MIN_FREE_KB: ${{ vars.EVO_RELEASE_MIN_FREE_KB }}
          EVO_WAHA_IMAGE_DIGEST: ${{ vars.EVO_WAHA_IMAGE_DIGEST }}
          EVO_SUPABASE_PROJECT_REF: ${{ vars.EVO_SUPABASE_PROJECT_REF }}
        run: |
          set -Eeuo pipefail
          [[ "$EVO_RELEASE_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$EVO_RELEASE_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9_-]{0,99}$ ]]
          [[ "$EVO_RELEASE_STAGING_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$EVO_RELEASE_EVIDENCE_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$EVO_RELEASE_EXTERNAL_HEALTH_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/api/health$ ]]
          [[ "$EVO_RELEASE_MIN_FREE_KB" =~ ^[0-9]+$ ]]
          (( EVO_RELEASE_MIN_FREE_KB >= 1048576 ))
          [[ "$EVO_WAHA_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EVO_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          for path in "$EVO_RELEASE_ROOT" "$EVO_RELEASE_STAGING_ROOT" "$EVO_RELEASE_EVIDENCE_ROOT"; do
            [[ "$path" != / && "$path" != *//* && "$path" != */../* && "$path" != */.. && "$path" != */./* && "$path" != */. ]]
          done

      - name: Require the conservative app-only scope
        env:
          EVO_RELEASE_REVISION: ${{ inputs.release_revision }}
          EVO_RELEASE_ROOT: ${{ vars.EVO_RELEASE_ROOT }}
          EVO_RELEASE_PROJECT_NAME: ${{ vars.EVO_RELEASE_PROJECT_NAME }}
        run: |
          set -Eeuo pipefail
          [[ "$EVO_RELEASE_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$EVO_RELEASE_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9_-]{0,99}$ ]]
          release_control="$EVO_RELEASE_ROOT/scripts/evo-fast-release.sh"
          status_json=$(ssh evo-production bash -s -- \
            "$release_control" \
            "$EVO_RELEASE_PROJECT_NAME" <<'REMOTE'
          set -Eeuo pipefail
          export EVO_RELEASE_PROJECT_NAME=$2
          exec "$1" status
          REMOTE
          )
          current_revision=$(jq -er '.revision' <<<"$status_json")
          [[ "$current_revision" =~ ^[0-9a-f]{40}$ ]]
          node scripts/fast-release-scope.mjs \
            --repo . \
            --from "$current_revision" \
            --to "$EVO_RELEASE_REVISION" \
            --output /tmp/evo-fast-release-scope.json

      - name: Verify the production migration ledger without mutation
        env:
          EVO_RELEASE_REPO: ${{ github.workspace }}
          EVO_SUPABASE_PROJECT_REF: ${{ vars.EVO_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          node scripts/fast-release-ledger-gate.mjs > /tmp/evo-fast-release-ledger.json

      - name: Stage the immutable archive on Hermes
        env:
          EVO_RELEASE_REVISION: ${{ inputs.release_revision }}
          EVO_RELEASE_STAGING_ROOT: ${{ vars.EVO_RELEASE_STAGING_ROOT }}
        run: |
          set -Eeuo pipefail
          [[ "$EVO_RELEASE_STAGING_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          run_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          stage_dir="$EVO_RELEASE_STAGING_ROOT/${EVO_RELEASE_REVISION}-${run_id}"
          ssh evo-production bash -s -- "$stage_dir" <<'REMOTE'
          set -Eeuo pipefail
          stage_dir=$1
          [[ "$stage_dir" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ ! -e "$stage_dir" ]]
          install -d -m 700 "$stage_dir"
          REMOTE
          scp /tmp/evo-fast-candidate/evo-crm-image.tar.gz "evo-production:$stage_dir/evo-crm-image.tar.gz"
          printf '%s\n' "$stage_dir" > /tmp/evo-fast-release-stage-dir

      - name: Run one preflight, deploy app, verify, and auto-rollback on failure
        env:
          EVO_RELEASE_REVISION: ${{ inputs.release_revision }}
          EVO_RELEASE_ROOT: ${{ vars.EVO_RELEASE_ROOT }}
          EVO_RELEASE_PROJECT_NAME: ${{ vars.EVO_RELEASE_PROJECT_NAME }}
          EVO_RELEASE_STAGING_ROOT: ${{ vars.EVO_RELEASE_STAGING_ROOT }}
          EVO_RELEASE_EVIDENCE_ROOT: ${{ vars.EVO_RELEASE_EVIDENCE_ROOT }}
          EVO_RELEASE_EXTERNAL_HEALTH_URL: ${{ vars.EVO_RELEASE_EXTERNAL_HEALTH_URL }}
          EVO_RELEASE_MIN_FREE_KB: ${{ vars.EVO_RELEASE_MIN_FREE_KB }}
          EVO_WAHA_IMAGE_DIGEST: ${{ vars.EVO_WAHA_IMAGE_DIGEST }}
        run: |
          set -Eeuo pipefail
          stage_dir=$(cat /tmp/evo-fast-release-stage-dir)
          image_id=$(jq -er '.imageId' /tmp/evo-fast-release-image.json)
          archive_sha256=$(jq -er '.archiveSha256' /tmp/evo-fast-release-image.json)
          compose_sha256=$(jq -er '.composeSha256' /tmp/evo-fast-release-image.json)
          release_version=$(jq -er '.version' /tmp/evo-fast-release-image.json)
          run_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_control="$EVO_RELEASE_ROOT/scripts/evo-fast-release.sh"
          set +e
          ssh evo-production bash -s -- \
            "$release_control" \
            "$EVO_RELEASE_ROOT" \
            "$EVO_RELEASE_PROJECT_NAME" \
            "$EVO_RELEASE_STAGING_ROOT" \
            "$EVO_RELEASE_EVIDENCE_ROOT" \
            "$EVO_RELEASE_EXTERNAL_HEALTH_URL" \
            "$EVO_RELEASE_MIN_FREE_KB" \
            "$EVO_WAHA_IMAGE_DIGEST" \
            "$EVO_RELEASE_REVISION" \
            "$release_version" \
            "$run_id" \
            "$stage_dir/evo-crm-image.tar.gz" \
            "$archive_sha256" \
            "$image_id" \
            "$compose_sha256" <<'REMOTE' \
            > /tmp/evo-fast-release-result-line.json \
            2> /tmp/evo-fast-release-controller-error.log
          set -Eeuo pipefail
          export EVO_RELEASE_ROOT=$2
          export EVO_RELEASE_PROJECT_NAME=$3
          export EVO_RELEASE_STAGING_ROOT=$4
          export EVO_RELEASE_EVIDENCE_ROOT=$5
          export EVO_RELEASE_COMPOSE_FILE="$2/docker-compose.prod.yml"
          export EVO_RELEASE_APP_ENV_FILE="$2/.env.production"
          export EVO_RELEASE_EXTERNAL_HEALTH_URL=$6
          export EVO_RELEASE_MIN_FREE_KB=$7
          export EVO_WAHA_IMAGE_DIGEST=$8
          unset EVO_RELEASE_DOCKER_STORAGE_PATH
          export EVO_RELEASE_REVISION=${9}
          export EVO_RELEASE_VERSION=${10}
          export EVO_RELEASE_RUN_ID=${11}
          export EVO_RELEASE_ARCHIVE=${12}
          export EVO_RELEASE_ARCHIVE_SHA256=${13}
          export EVO_RELEASE_EXPECTED_IMAGE_ID=${14}
          export EVO_RELEASE_EXPECTED_COMPOSE_SHA256=${15}
          exec "$1" deploy
          REMOTE
          release_status=$?
          set -e
          cat /tmp/evo-fast-release-result-line.json
          evidence_dir=$(jq -er '.evidenceDir' /tmp/evo-fast-release-result-line.json 2>/dev/null || true)
          if [[ -n "$evidence_dir" ]]; then
            [[ "$evidence_dir" == "$EVO_RELEASE_EVIDENCE_ROOT/"* ]]
            scp "evo-production:$evidence_dir/result.json" /tmp/evo-fast-release-result.json
          else
            failure_code=$(jq -Rr \
              'fromjson? | select(.ok == false) | .code // empty' \
              /tmp/evo-fast-release-controller-error.log | tail -n 1)
            if [[ ! "$failure_code" =~ ^[a-z0-9_]{1,64}$ ]]; then
              if [[ $release_status == 255 ]]; then
                failure_code=transport_failed
              elif [[ $release_status == 0 || $release_status == 3 || $release_status == 4 ]]; then
                failure_code=evidence_missing
                release_status=2
              else
                failure_code=controller_failed
              fi
            fi
            jq -cn \
              --arg code "$failure_code" \
              --arg revision "$EVO_RELEASE_REVISION" \
              --arg version "$release_version" \
              --arg image "$image_id" \
              '{schema:"evo-fast-release/v1",status:"blocked",code:$code,phase:"preflight_or_load",revision:$revision,version:$version,image:$image,rolledBack:false}' \
              > /tmp/evo-fast-release-result.json
            chmod 600 /tmp/evo-fast-release-result.json
            cat /tmp/evo-fast-release-result.json
          fi
          exit "$release_status"

      - name: Remove the staged image archive
        if: always()
        env:
          EVO_RELEASE_STAGING_ROOT: ${{ vars.EVO_RELEASE_STAGING_ROOT }}
        run: |
          set -Eeuo pipefail
          [[ -f /tmp/evo-fast-release-stage-dir ]] || exit 0
          stage_dir=$(cat /tmp/evo-fast-release-stage-dir)
          [[ "$EVO_RELEASE_STAGING_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$stage_dir" == "$EVO_RELEASE_STAGING_ROOT/"* ]]
          ssh evo-production bash -s -- "$stage_dir" "$EVO_RELEASE_STAGING_ROOT" <<'REMOTE'
          set -Eeuo pipefail
          stage_dir=$1
          staging_root=$2
          [[ "$stage_dir" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$staging_root" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$stage_dir" == "$staging_root/"* ]]
          archive="$stage_dir/evo-crm-image.tar.gz"
          [[ ! -L "$archive" ]]
          rm -f -- "$archive"
          rmdir -- "$stage_dir"
          REMOTE

      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evo-fast-release-${{ inputs.release_revision }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/evo-fast-release-scope.json
            /tmp/evo-fast-release-ledger.json
            /tmp/evo-fast-release-image.json
            /tmp/evo-fast-release-result.json

      - name: Remove the ephemeral deploy key
        if: always()
        run: rm -f "$HOME/.ssh/evo_deploy" "$HOME/.ssh/evo_known_hosts" "$HOME/.ssh/config"
