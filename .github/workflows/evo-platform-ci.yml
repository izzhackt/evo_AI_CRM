name: EVO platform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evo-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-range:
    if: github.event_name == 'pull_request'
    name: Changed range
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Refresh the main release baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Reject whitespace errors in the complete release diff
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "origin/main..$HEAD_SHA"

  crm:
    name: Main CRM
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test active V2 server-side boundaries
        run: npm run test:security

      - name: Install the locked Playwright Chromium runtime
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Test the V2 local PostgreSQL, migration, and browser contract
        timeout-minutes: 35
        run: npm run test:database:local

      - name: Test frontend state contracts
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit development dependencies against the temporary allowlist
        run: node scripts/check-npm-audit-allowlist.mjs
