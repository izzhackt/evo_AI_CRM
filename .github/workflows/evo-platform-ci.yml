name: EVO platform CI

on:
  workflow_dispatch:
    inputs:
      proof_revision:
        description: Exact current main commit SHA to prove.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: evo-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main_admission:
    name: Current main admission
    runs-on: ubuntu-latest
    steps:
      - name: Admit only the exact current main revision
        env:
          EVO_API_URL: ${{ github.api_url }}
          EVO_EXPECTED_REPOSITORY: izzhackt/evo_AI_CRM
          EVO_EVENT_NAME: ${{ github.event_name }}
          EVO_REF: ${{ github.ref }}
          EVO_REF_NAME: ${{ github.ref_name }}
          EVO_REPOSITORY: ${{ github.repository }}
          EVO_PROOF_REVISION: ${{ inputs.proof_revision }}
          EVO_SHA: ${{ github.sha }}
          EVO_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const env = process.env;
          const fail = () => {
            process.stderr.write("::error::manual_platform_ci_admission_failed\n");
            process.exit(2);
          };
          const exact = (name, value) => {
            if (env[name] !== value) fail();
          };
          const main = async () => {
            exact("EVO_EXPECTED_REPOSITORY", "izzhackt/evo_AI_CRM");
            exact("EVO_EVENT_NAME", "workflow_dispatch");
            exact("EVO_REF", "refs/heads/main");
            exact("EVO_REF_NAME", "main");
            exact("EVO_REPOSITORY", env.EVO_EXPECTED_REPOSITORY);
            if (!/^[0-9a-f]{40}$/u.test(env.EVO_SHA ?? "")) fail();
            if (!/^[0-9a-f]{40}$/u.test(env.EVO_PROOF_REVISION ?? "")) fail();
            exact("EVO_PROOF_REVISION", env.EVO_SHA);
            exact("EVO_WORKFLOW_SHA", env.EVO_SHA);
            const response = await fetch(
              `${env.EVO_API_URL}/repos/${env.EVO_EXPECTED_REPOSITORY}/git/ref/heads/main`,
              {
                headers: {
                  Accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                },
                redirect: "error",
                signal: AbortSignal.timeout(15_000),
              },
            );
            if (!response.ok) fail();
            const payload = await response.json();
            if (payload?.object?.type !== "commit" || payload?.object?.sha !== env.EVO_SHA) fail();
            process.stdout.write('{"ok":true,"code":"manual_platform_ci_admitted"}\n');
          };
          main().catch(fail);
          NODE

  # This check admits a scoped release; it is not full-product acceptance.
  # The downstream workflow builds the immutable image and exercises the real
  # changed production paths before accepting it, with rollback on failure.
  crm:
    name: Main CRM
    needs: main_admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Check release entrypoint syntax
        run: |
          set -Eeuo pipefail
          bash -n scripts/evo-fast-release.sh
          node --check scripts/evo-production-browser-smoke.mjs
          node --check scripts/fast-release-ledger-gate.mjs

      - name: Check scoped release source contracts
        run: >-
          node --test
          --test-name-pattern='^(CI and the exact-SHA gate require only the current root successor|active platform CI executes only the root successor product|workflow binds exact green main to one runner-built immutable release)$'
          tests/p6d-release-candidate.test.mjs
          tests/fast-release-control.test.mjs
