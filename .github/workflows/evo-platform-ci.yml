name: EVO platform CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evo-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main_admission:
    name: Current main admission
    runs-on: ubuntu-latest
    steps:
      - name: Admit only the exact current main revision
        env:
          EVO_API_URL: ${{ github.api_url }}
          EVO_EXPECTED_REPOSITORY: izzhackt/evo_AI_CRM
          EVO_EVENT_NAME: ${{ github.event_name }}
          EVO_REF: ${{ github.ref }}
          EVO_REF_NAME: ${{ github.ref_name }}
          EVO_REPOSITORY: ${{ github.repository }}
          EVO_SHA: ${{ github.sha }}
          EVO_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const env = process.env;
          const fail = () => {
            process.stderr.write("::error::manual_platform_ci_admission_failed\n");
            process.exit(2);
          };
          const exact = (name, value) => {
            if (env[name] !== value) fail();
          };
          const main = async () => {
            exact("EVO_EXPECTED_REPOSITORY", "izzhackt/evo_AI_CRM");
            exact("EVO_EVENT_NAME", "workflow_dispatch");
            exact("EVO_REF", "refs/heads/main");
            exact("EVO_REF_NAME", "main");
            exact("EVO_REPOSITORY", env.EVO_EXPECTED_REPOSITORY);
            if (!/^[0-9a-f]{40}$/u.test(env.EVO_SHA ?? "")) fail();
            exact("EVO_WORKFLOW_SHA", env.EVO_SHA);
            const response = await fetch(
              `${env.EVO_API_URL}/repos/${env.EVO_EXPECTED_REPOSITORY}/git/ref/heads/main`,
              {
                headers: {
                  Accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                },
                redirect: "error",
                signal: AbortSignal.timeout(15_000),
              },
            );
            if (!response.ok) fail();
            const payload = await response.json();
            if (payload?.object?.type !== "commit" || payload?.object?.sha !== env.EVO_SHA) fail();
            process.stdout.write('{"ok":true,"code":"manual_platform_ci_admitted"}\n');
          };
          main().catch(fail);
          NODE

  crm_product:
    name: Main CRM product
    needs: main_admission
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test active V3 server-side boundaries
        run: npm run test:security

      - name: Install the locked Playwright Chromium runtime
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Test the V3 local PostgreSQL, migration, and browser contract
        timeout-minutes: 35
        run: npm run test:database:local

      - name: Test frontend state contracts
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  dependency_audit:
    name: Dependency audit
    needs: main_admission
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm audit CLI
        timeout-minutes: 4
        env:
          npm_config_audit: "false"
          npm_config_fetch_retries: "0"
          npm_config_fetch_timeout: "30000"
          npm_config_fund: "false"
        run: |
          for attempt in 1 2 3; do
            audit_prefix="$RUNNER_TEMP/npm-audit-cli-$attempt"
            if timeout 60s npm install --prefix "$audit_prefix" npm@11.19.0 --ignore-scripts --no-audit --no-fund \
              && test "$("$audit_prefix/node_modules/.bin/npm" --version)" = "11.19.0"; then
              echo "$audit_prefix/node_modules/.bin" >> "$GITHUB_PATH"
              echo "EVO_NPM_BIN=$audit_prefix/node_modules/.bin/npm" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Audit production dependencies
        # Lockfile-only avoids platform-specific installed-tree drift on the
        # runner: https://docs.npmjs.com/cli/v11/commands/npm-audit/#package-lock-only
        timeout-minutes: 4
        env:
          npm_config_fetch_retries: "0"
          npm_config_fetch_timeout: "70000"
        run: |
          if ! test -x "$EVO_NPM_BIN"; then
            echo "Pinned npm audit CLI is unavailable: $EVO_NPM_BIN" >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$EVO_NPM_BIN" audit --package-lock-only --omit=dev --audit-level=moderate; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Audit development dependencies against the temporary allowlist
        timeout-minutes: 4
        env:
          npm_config_fetch_retries: "0"
          npm_config_fetch_timeout: "70000"
        run: |
          if ! test -x "$EVO_NPM_BIN"; then
            echo "Pinned npm audit CLI is unavailable: $EVO_NPM_BIN" >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            if node scripts/check-npm-audit-allowlist.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

  crm:
    name: Main CRM
    if: ${{ always() }}
    needs:
      - main_admission
      - crm_product
      - dependency_audit
    runs-on: ubuntu-latest
    steps:
      - name: Require product and dependency gates
        env:
          ADMISSION_RESULT: ${{ needs.main_admission.result }}
          PRODUCT_RESULT: ${{ needs.crm_product.result }}
          AUDIT_RESULT: ${{ needs.dependency_audit.result }}
        run: |
          test "$ADMISSION_RESULT" = "success"
          test "$PRODUCT_RESULT" = "success"
          test "$AUDIT_RESULT" = "success"
