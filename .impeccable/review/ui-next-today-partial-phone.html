/*
 * EVO workbench — owner-requested brand refresh, 09.09.2026.
 *
 * Два потребителя этого файла. Staff CRM — layout `(staff)` ставит на корень
 * `.v3-world` атрибут `data-surface="staff"`, и облик сотрудников — блок
 * `.v3-world[data-surface="staff"]` ниже (план редизайна 25.09, принят для
 * всех 27.09, Э1.5). Кабинет студента (`(portal)`, `components/portal/Shell`)
 * рисует прежние экраны в `.v3-world` без этого атрибута и живёт базовыми
 * значениями этого блока — они не меняются вместе с обликом сотрудников.
 *
 * Базовое направление: светлая нейтральная земля, белая плоская поверхность,
 * тонкая волосяная рамка, маленькое скругление, много воздуха. Статусы
 * сохраняют свои тона и всегда названы текстом. Красный #d70217 взят из
 * logobook; нейтральные панели сохраняют спокойную рабочую среду без
 * декоративных цветных подложек.
 *
 * Тёмной темы у этого мира нет. Референс — светлый, и держать тёмного близнеца
 * для пробы значило бы удваивать работу по контрасту ради того, чего в
 * референсе не существует. Значения ниже заданы безусловно и поэтому
 * перекрывают тёмные значения V2, когда система просит тёмную тему.
 *
 * Каждое значение посчитано до того, как попало сюда: текст ≥4.5:1 на каждой
 * поверхности мира и на каждой пилюле, граница контрола ≥3:1 (SC 1.4.11),
 * соседние ступени поверхностей ≥1.08.
 */

.v3-world {
  color-scheme: light;
  /* Земля светлее поверхности была бы бессмыслицей: белое — это лист, серое —
     стол. Ступени идут от белого вниз: surface → bg → surface-2 → surface-3. */
  --surface: #ffffff;
  --bg: #f3f3f3;
  --surface-2: #e7e7e7;
  --surface-3: #dbdbdb;

  --text: #202020;
  --text-2: #434343;
  --text-3: #5f5f5f;

  --border: #dedede;
  --border-strong: #c5c5c5;
  --control-edge: #777777;

  /* Primary red is from the logobook; text uses a darker accessible red. */
  --accent: #d70217;
  --accent-2: #b50013;
  --on-accent: #ffffff;
  --accent-text: #b50013;
  /* Active controls only, never decorative colour behind business records. */
  --accent-weak: #fff0f1;
  --accent-weak-muted: #f8e4e6;

  --focus-ring: #b50013;
  --focus-halo: rgb(215 2 23 / 0.12);

  /* Статусы сохраняют собственные тона и подписи.
     Текст пилюли на своей подложке: 5.7–6.7:1. */
  --ok: #0f6b41;
  --ok-weak: #e4f3ea;
  --warn: #7a4a04;
  --warn-weak: #fbf0dc;
  --danger: #b42318;
  --danger-weak: #fceceb;
  --info: #1c4fa8;
  --info-weak: #e8f0fd;

  --sidebar: #ffffff;
  --sidebar-muted: #5f5f5f;

  /* Материал этого мира — рамка, а не тень. Тень остаётся только тому, что
     действительно висит над страницей: выпадающим спискам. */
  --shadow: 0 1px 2px rgb(26 26 25 / 0.05);
  --shadow-lg: 0 4px 16px -4px rgb(26 26 25 / 0.14), 0 1px 3px rgb(26 26 25 / 0.06);

  background: var(--bg);
  min-height: 100dvh;
  color: var(--text);
}

/*
 * Облик staff CRM — план редизайна 25.09.2026
 * (docs/archive/plans/2026-09-25-crm-redesign-plan.md), для всех сотрудников с 27.09
 * (Э1.5, решение владельца). Те же имена токенов, переопределённые на корне
 * staff CRM (`data-surface="staff"` ставит layout `(staff)`); кабинет студента
 * этих значений не получает.
 *
 * Правила плана: работа — белый лист на тёплом сером столе; красный текст —
 * только проблема (`--danger`), сплошной красный — главное действие страницы;
 * «выбрано» — нейтральное; панели, таблицы и строки лежат плоско, волосяной
 * тенью приподняты только кнопки и карточки досок (`.v3-raised`).
 *
 * Посчитано до CSS: текст (`--text`, `--text-2`, `--text-3`, статусы) ≥4.5:1 на
 * листе, столе, `--surface-2`, `--surface-3` и на выбранном; граница контрола
 * и рамка фокуса ≥3:1; ступени лист/стол 1.13, стол/`--surface-2` 1.10,
 * выбранное/лист 1.38, выбранное/стол 1.22, выбранное/наведение
 * (`--surface-2`) 1.12. Типографика не меняется (роли 24.09).
 */
.v3-world[data-surface="staff"] {
  --bg: #f3f1ec;
  /* Мелкий тёмно-красный акцент становится обычным тёмным текстом. */
  --accent-text: #202020;
  /* «Выбрано» — нейтральная подложка вместо бледно-красной (#1048), темнее наведения. */
  --accent-weak: #dfdbd3;
  --focus-ring: #202020;
  --focus-halo: rgb(32 32 32 / 0.12);
  --shadow-raised: 0 1px 1px rgb(26 26 25 / 0.1);
  /* Три цвета фаз (Э1.4) — только точка чипа этапа и дорожка этапа, всегда со
     словом. Оттенки вне статусов (красный, янтарный, зелёный, синий):
     «Продажи» — слива, «Поступление» — бирюза, «Виза и выезд» — фиалка;
     ≥4.2:1 на листе, столе, `--surface-2`, `--surface-3` и «выбрано». */
  --phase-sales: #9b2c7a;
  --phase-admission: #0e6f75;
  --phase-visa: #5b45b0;
}

/*
 * Без красного ссылка и текстовая кнопка-действие остаются узнаваемыми: они
 * подчёркнуты всегда. Выбранный пункт (`aria-current`, `aria-pressed`,
 * подложка `bg-accent-weak` — например, активный раздел меню) — не ссылка
 * «куда-то», его держит нейтральная подложка.
 */
.v3-world[data-surface="staff"] :is(a, button):is(.text-accent, .text-accent-text):not([aria-current], [aria-pressed="true"], .bg-accent-weak) {
  text-decoration-line: underline;
  text-underline-offset: 4px;
}

/* Фокус клавиатуры сохраняет свой ореол (globals.css) — тень его не перекрывает. */
.v3-world[data-surface="staff"] .v3-raised:not(:disabled):not(:focus-visible) {
  box-shadow: var(--shadow-raised);
}

/*
 * Оболочка staff CRM (Э1.2, AppShell.tsx). Верхней панели нет; на телефоне
 * (<768 px) сверху одна строка, снизу панель вкладок. Их высоты — одни
 * переменные в rem: строка, панель, отступ содержимого и высота страниц «на
 * окно» считаются в одних единицах и не расходятся при крупном корневом
 * шрифте. Страница «на окно» — `main` с высотой из 100dvh («Переписка»,
 * «Командный чат»): её поле ответа стоит над панелью вкладок, а на
 * компьютере она занимает окно целиком. WhatsApp (PartShell
 * `fill`) своей высоты не задаёт: от 768 px её даёт колонка оболочки
 * (`isFillRoute`); на телефоне страница идёт обычным потоком над панелью
 * вкладок.
 */
.v3-world[data-surface="staff"] {
  --shell-top: 0px;
  --shell-tabbar: 0px;
  --shell-safe-bottom: 0px;
  /* Отступ над заголовком страницы: один у всех разделов, центр заголовка —
     на уровне центра логотипа в боковом меню (AppShell, `pt-3.5`). */
  --shell-page-top: 1.5rem;
}

@media (width < 48rem) {
  .v3-world[data-surface="staff"] {
    --shell-top: 3.5rem;
    --shell-tabbar: 3.5rem;
    --shell-safe-bottom: env(safe-area-inset-bottom, 0px);
    --shell-page-top: 1.25rem;
  }
}

.v3-world[data-surface="staff"] [data-shell-content] main:is(.h-dvh, [class*="100dvh"]) {
  height: calc(100dvh - var(--shell-top) - var(--shell-tabbar) - var(--shell-safe-bottom));
}

/*
 * «Продажи → WhatsApp» на телефоне (решение владельца 06.10.2026): открытый
 * чат забирает экран между строкой логотипа и панелью вкладок, как
 * «Переписка». Заголовок страницы остаётся только для читалки, лента
 * прокручивается сама, поле ответа всегда внизу над вкладками.
 */
@media (width < 48rem) {
  .v3-world[data-surface="staff"] [data-shell-content] main:has(> div:first-child > div:first-child > h1.t-page-title):has([data-inbox-open]) {
    padding: 0;
  }
  .v3-world[data-surface="staff"] [data-shell-content] main:has([data-inbox-open]) > div:first-child {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .v3-world[data-surface="staff"] [data-shell-content] main > div:has(> .v3-inbox[data-inbox-open]) {
    margin-top: 0;
  }
  .v3-world[data-surface="staff"] .v3-inbox[data-inbox-open] {
    /* `flex-1` would size it to its content in the page's column. */
    flex: none;
    height: calc(100dvh - var(--shell-top) - var(--shell-tabbar) - var(--shell-safe-bottom));
    border-radius: 0;
    border-inline: 0;
    border-top: 0;
  }
}

/*
 * «ИИ-агенты → Поручить» на телефоне (решение владельца 23.10.2026): чат —
 * как открытый чат WhatsApp: рабочая область забирает экран между строкой
 * логотипа и панелью вкладок, лента прокручивается сама, поле поручения всегда
 * внизу над вкладками. Шапка страницы и полоса вкладок агента остаются только
 * для читалки; к разделам агента ведёт стрелка над чатом. От 768 px высоту даёт
 * колонка оболочки (`isFillRoute`).
 *
 * Скрытое остаётся в порядке табуляции, поэтому, пока в блоке стоит фокус
 * (`:focus-within`), он показывается: невидимый переключатель «Авто» нельзя
 * нажать вслепую. Без фокуса блок свёрнут в точку.
 */
@media (width < 48rem) {
  .v3-world[data-surface="staff"] [data-shell-content] main:has([data-aia-workspace]) {
    padding: 0;
  }
  .v3-world[data-surface="staff"] [data-shell-content] main:has([data-aia-workspace]) > :not(:last-child):not(:focus-within),
  .v3-world[data-surface="staff"] [data-shell-content] main [data-aia-chat] > :not(:last-child):not(:focus-within) {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .v3-world[data-surface="staff"] [data-shell-content] main:has([data-aia-workspace]) > :not(:last-child):focus-within,
  .v3-world[data-surface="staff"] [data-shell-content] main [data-aia-chat] > :not(:last-child):focus-within {
    /* Главный `main` без полей (чат во весь экран): показанному блоку поля возвращаются. */
    padding: 0.5rem 1rem;
  }
  .v3-world[data-surface="staff"] [data-shell-content] main:has([data-aia-workspace]) > :last-child {
    margin-top: 0;
  }
  .v3-world[data-surface="staff"] [data-aia-workspace] {
    /* `flex-1` would size it to its content in the page's column. */
    flex: none;
    min-height: 0;
    height: calc(100dvh - var(--shell-top) - var(--shell-tabbar) - var(--shell-safe-bottom));
  }
  .v3-world[data-surface="staff"] [data-aia-sheet] {
    border-radius: 0;
    border-inline: 0;
    border-top: 0;
  }
}

/*
 * Верх страницы без верхней панели: заголовок стоит на одной высоте у всех
 * разделов, переход «Задачи» → «Студенты» не прыгает. Страницы с PageHeader
 * (PartShell, доски, «Переписка») — отступ `main`.
 */
.v3-world[data-surface="staff"] [data-shell-content] main:has(> div:first-child > div:first-child > h1.t-page-title) {
  padding-top: var(--shell-page-top);
}

/*
 * Список меню длиннее окна: у края, за которым есть ещё пункты, — знак.
 * Сверху — мягкая тень внутрь (та же, что под прилипшим заголовком группы
 * «Студентов»). Снизу (Э6, 27.09.2026) — срезанный краем пункт
 * приглушается к фону меню, но остаётся виден, а над строкой аккаунта лежит
 * тень: пункт ниже края не пропадает молча. Прокрутили до конца — знака у
 * этого края нет. Затухание — прилипший псевдоэлемент внутри списка, поэтому
 * он стоит у края окна, а не у конца содержимого, и не ловит нажатия.
 */
.v3-world[data-surface="staff"] [data-shell-scroll][data-more-above] {
  box-shadow: inset 0 8px 8px -6px rgb(0 0 0 / 0.16);
}

/* Полоса прокрутки списка меню — тонкая и цветом рамки: раскрытый отдел сужает строки меню
   на несколько пикселей, а не на 15. Место под неё заранее не резервируется: в рейке 64 px
   пункты не должны стать уже 44 px, когда прокрутки нет. */
.v3-world[data-surface="staff"] [data-shell-scroll] {
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}

.v3-world [data-shell-scroll][data-more-below]::after {
  content: "";
  position: sticky;
  bottom: 0;
  display: block;
  flex-shrink: 0;
  height: 1.75rem;
  margin-top: -1.75rem;
  background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--surface) 75%, transparent));
  pointer-events: none;
}

.v3-world[data-surface="staff"] [data-shell-scroll][data-more-below] + [data-shell-account] {
  position: relative;
  z-index: 1;
  box-shadow: 0 -6px 10px -6px rgb(0 0 0 / 0.24);
}

/* Лист «Ещё»: строка и панель вкладок стоят на месте, содержимое появляется
   коротким подъёмом; при просьбе системы — без движения. */
@media (prefers-reduced-motion: no-preference) {
  .v3-world[data-surface="staff"] [data-shell-menu][data-sheet-open] > [data-shell-menu-body] {
    animation: v3-shell-sheet-in 180ms cubic-bezier(0.16, 1, 0.3, 1);
  }
}

@keyframes v3-shell-sheet-in {
  from {
    opacity: 0;
    transform: translateY(0.75rem);
  }
}

/* Скругление мелкое: у референса окно софта, а не карточка-плитка. */
.v3-world .rounded-card {
  border-radius: 10px;
}
.v3-world .rounded-ctl {
  border-radius: 8px;
}
.v3-world .rounded-nav {
  border-radius: 6px;
}

/* Logical status edges stay explicit because Tailwind does not expose
   theme-backed `border-s-*` colour utilities for these product tokens. */
.v3-world .v3-edge-ok {
  border-inline-start-color: var(--ok);
}
.v3-world .v3-edge-warn {
  border-inline-start-color: var(--warn);
}
.v3-world .v3-edge-danger {
  border-inline-start-color: var(--danger);
}
.v3-world .v3-edge-muted {
  border-inline-start-color: var(--border-strong);
}

/*
 * В предыдущей пробе `.bg-surface` автоматически парил — тень была основным
 * приёмом. Здесь наоборот: поверхность лежит плоско, а границу держит рамка.
 * Автоматической тени поэтому нет, и правило про вложенную поверхность стало
 * не нужно.
 */

/* Тонкая полоса фокуса под цвет мира: по умолчанию браузер рисует синюю. */
.v3-world :focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 3px;
}

/*
 * Полоса вкладок с горизонтальной прокруткой (`overflow-x: auto`) обрезает
 * рамку, вынесенную наружу на 3 px: видны лишь правый и нижний край. У
 * вкладок такой полосы рамка внутри (снимок клавиатурного фокуса дела
 * студента, 26.09.2026).
 */
.v3-world [data-tab-strip] .v3-choice:focus-visible {
  outline-offset: -2px;
}

/*
 * Ряд вкладок-ссылок (`QueueViewTabs`; с 14.11.2026 у рядов нет линии и
 * нижнего поля): ряд ровно по высоте вкладки, и рамка снаружи обрезалась бы
 * сверху, снизу и слева у первой вкладки (проверка клавиатурного фокуса,
 * 26.10.2026). Рамка внутри, как у вкладок профиля.
 */
.v3-world [data-tab-ring="inset"] .v3-choice:focus-visible {
  outline-offset: -2px;
}

/*
 * Поле ответа чата WhatsApp и поле «Поручить» ИИ-агента: полосу фокуса рисует
 * их рамка (вместе с кнопкой «Шаблон» или «Без черновика» и «Отправить»), иначе
 * внутри рамки появлялась вторая — у самого textarea (снимок
 * connection-lost-390, ревью 06.10.2026).
 */
.v3-world [data-composer-input]:focus-visible {
  outline: none;
  /* и ореол фокуса полей формы (globals.css) — его тоже рисовала бы вторая рамка */
  box-shadow: none;
}

/*
 * Заголовок записи в панели очереди получает фокус скриптом (tabindex="-1"),
 * чтобы читалка назвала открытую запись. Это не элемент управления: рамка
 * фокуса вокруг заголовка — лишний красный. Та же граница, что у
 * `[tabindex="-1"]` в globals.css.
 */
.v3-world [data-queue-heading]:focus-visible {
  outline: none;
}

/* Foreground red stays readable even on the deepest neutral surface. */
.v3-world .text-accent {
  color: var(--accent-text);
}

/*
 * Единый вид «выбрано» (24.09.2026): вкладки, сегменты, навигация разделов и
 * чипы фильтров. Строка списка или карточка доски, чья запись открыта в
 * боковой панели рядом, выбрана иначе — `aria-current` и подложка `surface-2`
 * (Э7, 27.09: одна боковая панель везде). Сплошной красный
 * остаётся только главному действию экрана. Вид включается лишь объявленным
 * состоянием — aria-current, aria-pressed="true" или aria-expanded="true", —
 * поэтому выбранное нельзя показать одним цветом без смысла для читалки.
 * --accent-text на --accent-weak: 6.4:1; рамка (если она есть) того же цвета.
 */
.v3-world .v3-choice:is([aria-current]:not([aria-current="false"]), [aria-pressed="true"], [aria-expanded="true"]) {
  border-color: var(--accent-text);
  background-color: var(--accent-weak);
  color: var(--accent-text);
  font-weight: 600;
}

/*
 * «Перезвонить» в строке итога звонка раскрывает поле дня, но выбранным не является: раскрытая кнопка рядом с
 * отмеченным итогом выглядела бы вторым выбранным. Раскрытие — только тёмная рамка; плашка и жирность остаются
 * у `aria-pressed="true"`.
 */
.v3-world [data-testid="v3-call-result"] .v3-choice[aria-expanded="true"]:not([aria-pressed="true"]) {
  border-color: var(--text);
  background-color: var(--surface);
  color: var(--text);
  font-weight: inherit;
}

/*
 * Всплывающее меню и окно у своей кнопки (рабочая очередь, 25.09.2026):
 * popover API держит его в верхнем слое — контейнер с прокруткой его не
 * обрежет, — а CSS anchor positioning ставит под кнопкой и переворачивает у
 * края окна. Имя якоря задаёт компонент (`anchor-name`/`position-anchor`);
 * где anchor positioning нет, место считает `useAnchoredPopover`.
 */
.v3-world .v3-anchored {
  inset: auto;
  margin: 4px 0;
  position-area: block-end span-inline-end;
  position-try-fallbacks: flip-block, flip-inline;
}
.v3-world .v3-anchored-end {
  position-area: block-end span-inline-start;
}

/*
 * Ряд вкладок-видов очереди (`QueueTabStrip`) не переносится, а
 * прокручивается вбок. Полосы прокрутки нет — у края, за которым ещё есть
 * вкладки, ряд гаснет маской на 3rem (это знак «дальше есть», а не
 * приглушение состояния); текущая вкладка всегда в видимой части.
 */
.v3-world .v3-tab-strip {
  scrollbar-width: none;
}
.v3-world .v3-tab-strip::-webkit-scrollbar {
  display: none;
}
/* `--tab-pin` — ширина вкладки, прилипшей к правому краю (`QueueTabStrip`): правое затухание кончается перед ней, сама она не гаснет. */
/* Фокус с клавиатуры и прокрутка к вкладке не оставляют вкладку под прилипшей: правый край видимой части — перед ней. */
.v3-world .v3-tab-strip {
  scroll-padding-inline-end: var(--tab-pin, 0px);
}
.v3-world .v3-tab-strip[data-fade-end] {
  mask-image: linear-gradient(to right, #000 calc(100% - 3rem - var(--tab-pin, 0px)), transparent calc(100% - var(--tab-pin, 0px)), #000 calc(100% - var(--tab-pin, 0px)));
}
.v3-world .v3-tab-strip[data-fade-start] {
  mask-image: linear-gradient(to left, #000 calc(100% - 3rem), transparent);
}
.v3-world .v3-tab-strip[data-fade-start][data-fade-end] {
  mask-image: linear-gradient(to right, transparent, #000 3rem, #000 calc(100% - 3rem - var(--tab-pin, 0px)), transparent calc(100% - var(--tab-pin, 0px)), #000 calc(100% - var(--tab-pin, 0px)));
}

/*
 * Липкий заголовок группы по сроку («Студенты»): непрозрачный во всю высоту,
 * с волосяной линией на своей ячейке. Когда он прилип к верху, под ним
 * появляется мягкая тень со смещением вниз — строка, уходящая под заголовок,
 * читается как прокрутка, а не как его продолжение. Где запросов
 * `scroll-state` нет, остаются фон и линия.
 */
.v3-world .v3-sticky-band {
  container-type: scroll-state;
}

@container scroll-state(stuck: top) {
  .v3-world .v3-sticky-band > * {
    box-shadow: 0 6px 8px -6px rgb(0 0 0 / 0.16);
  }
}

/*
 * Строка-таблица очереди («Студенты», «Нагрузка кураторов»;
 * с 26.09 — строки «Задач» и «Сегодня»): ссылка строки покрывает всю строку,
 * поэтому и фокус клавиатуры — рамка всей строки внутрь, а не вокруг имени
 * (там она наезжала на «направление · уровень»).
 */
.v3-world .v3-queue-row [data-queue-open]:focus-visible {
  outline: none;
  box-shadow: none;
}
.v3-world .v3-queue-row:has([data-queue-open]:focus-visible) {
  outline: 2px solid var(--focus-ring);
  outline-offset: -2px;
}

/*
 * Одна боковая панель записи (Э7, `SidePanel`). Ширина — один
 * токен для сетки «список | панель», листа и доски (26rem = 416 px,
 * `SIDE_PANEL_WIDTH_REM`). Уже 1280 px панель — модальный лист в верхнем
 * слое: он коротко выезжает справа, затемнение проявляется; рядом со
 * списком панель не движется. При `prefers-reduced-motion` движения нет.
 */
.v3-world {
  --side-panel-width: 26rem;
}

@media (prefers-reduced-motion: no-preference) {
  .v3-world [data-side-panel]:modal {
    animation: v3-side-sheet-in 200ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .v3-world [data-side-panel]:modal::backdrop {
    animation: v3-side-backdrop-in 200ms ease-out;
  }
}

@keyframes v3-side-sheet-in {
  from {
    opacity: 0;
    transform: translateX(1.5rem);
  }
}

@keyframes v3-side-backdrop-in {
  from {
    opacity: 0;
  }
}

/*
 * Шрифтовые роли staff CRM (24.09.2026, решение владельца: Golos Text для
 * интерфейса, JetBrains Mono только для технических значений).
 *
 * Роль — это назначение текста, а не размер: заголовок страницы, имя записи,
 * раздел, пункт, текст, подпись поля, метаданные, подпись колонки/статуса,
 * крупная цифра. Значения заданы один раз токенами на `.v3-world`; классы
 * `t-*` и CSS-модули читают только токены. Шкала общего `globals.css` (её
 * делит портал) не меняется; единицы — px, как у остальной шкалы, чтобы
 * роли не расходились с `text-sm` при нестандартном размере шрифта браузера.
 *
 * Правила: ничего меньше 12 px; вес только 400/500/600; без заглавных
 * подписей и положительной разрядки; счётчики, суммы и KPI — табличные
 * цифры Golos (`tabular-nums`); `font-mono` — только идентификаторы, коды,
 * версии, даты и время в плотных колонках и метки времени (правило
 * DESIGN.md). `t-caption` называет данные, `t-meta` — второстепенные
 * сведения; подпись поля или фильтра — `t-label`. Роль не сочетается на
 * одном элементе с `text-*`/`font-*`/`leading-*`/`tracking-*`: утилита
 * молча победит. Цвет остаётся за утилитами `text-fg*`.
 *
 * Классы лежат в `@layer components`: база Tailwind (сброс h1–h6) ниже них,
 * утилиты и несложенный `.v3-choice` (вес 600 у выбранного) — выше. Порядок
 * слоёв повторяет объявление Tailwind на случай, если этот файл загрузится
 * раньше `globals.css`.
 */
.v3-world {
  --type-page-title: 24px;
  --type-page-title-leading: 32px;
  --type-record-title: 20px;
  --type-record-title-leading: 28px;
  --type-section: 16px;
  --type-section-leading: 24px;
  --type-item: 14px;
  --type-item-leading: 20px;
  --type-body: 16px;
  --type-body-leading: 24px;
  --type-body-compact: 14px;
  --type-body-compact-leading: 21px;
  --type-label: 14px;
  --type-label-leading: 20px;
  --type-meta: 12px;
  --type-meta-leading: 16px;
  --type-caption: 12px;
  --type-caption-leading: 16px;
  --type-figure: 28px;
  --type-figure-leading: 32px;
  /* Golos крупнее 20 px слегка поджимается; мельче — без разрядки. */
  --type-title-tracking: -0.01em;
  /* Удобная длина строки для статьи базы знаний и других длинных текстов. */
  --type-measure: 70ch;
}

@layer properties, theme, base, components, utilities;

@layer components {
  /* Один h1 на экран: PageHeader, экраны ошибок и доступа, отчёт продаж, чаты. */
  .v3-world .t-page-title {
    font-size: var(--type-page-title);
    line-height: var(--type-page-title-leading);
    font-weight: 600;
    letter-spacing: var(--type-title-tracking);
    text-wrap: balance;
  }
  /* Имя того, чья карточка открыта: дело, запись продажи, сотрудник, шаблон. */
  .v3-world .t-record-title {
    font-size: var(--type-record-title);
    line-height: var(--type-record-title-leading);
    font-weight: 600;
    letter-spacing: var(--type-title-tracking);
    text-wrap: balance;
  }
  /* Заголовок карточки, панели, области или диалога. */
  .v3-world .t-section {
    font-size: var(--type-section);
    line-height: var(--type-section-leading);
    font-weight: 600;
  }
  /* Группа внутри карточки, имя строки или карточки в списке. */
  .v3-world .t-item {
    font-size: var(--type-item);
    line-height: var(--type-item-leading);
    font-weight: 600;
  }
  /* Абзацы и сообщения; длинный текст — не шире `--type-measure`. */
  .v3-world .t-body {
    font-size: var(--type-body);
    line-height: var(--type-body-leading);
    font-weight: 400;
  }
  /* Плотный рабочий текст: ячейки, строки, пояснения, фильтры. */
  .v3-world .t-body-compact {
    font-size: var(--type-body-compact);
    line-height: var(--type-body-compact-leading);
    font-weight: 400;
  }
  /* Подпись поля формы (`fieldLabelCls`) и подпись фильтра или контрола в
     строке — над контролом или рядом с ним. */
  .v3-world .t-label {
    font-size: var(--type-label);
    line-height: var(--type-label-leading);
    font-weight: 500;
  }
  /* Время, автор, счётчик, вторичная строка. Не ошибка и не действие. */
  .v3-world .t-meta {
    font-size: var(--type-meta);
    line-height: var(--type-meta-leading);
    font-weight: 400;
  }
  /* Подпись данных: колонка, термин, статус, чип, группа чипов или навигации —
     вместо заглавных микроподписей. Подпись поля или фильтра — `t-label`. */
  .v3-world .t-caption {
    font-size: var(--type-caption);
    line-height: var(--type-caption-leading);
    font-weight: 500;
  }
  /* KPI и итог: табличные цифры Golos, не моноширинный. */
  .v3-world .t-figure {
    font-size: var(--type-figure);
    line-height: var(--type-figure-leading);
    font-weight: 600;
    letter-spacing: var(--type-title-tracking);
    font-variant-numeric: tabular-nums;
  }
}

/* Comfortable disclosure targets without surrounding every action in a card. */
.v3-world summary {
  min-height: 44px;
  align-content: center;
}

.v3-world :where(button, a, summary) {
  transition-duration: 150ms;
  transition-property: color, background-color, border-color;
}

@media (prefers-reduced-motion: reduce) {
  .v3-world *, .v3-world *::before, .v3-world *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/*
 * Общие блоки staff CRM (Э1.3–Э1.4 плана редизайна, 26.09.2026;
 * src/components/staff/blocks/). Правила — на корне staff CRM; кабинет
 * студента блоков не рисует. Шрифт — роли `t-*` в разметке; здесь только
 * форма и цвет.
 *
 * - `.v3-chip` — статус словом; цвет подкрепляет слово, красный — проблема.
 * - `.v3-stage` — этап: точка цвета фазы и слово доски; слово переносится.
 * - `.v3-due` — срок словом; «сегодня» — маленькая красная заливка:
 *   белый на `#d70217` 5.4:1.
 * - `.v3-initials` — нейтральный круг 24 px: `--text-2` на `--surface-2` 8:1.
 * - `.v3-progress` — подпись «N из M» и полоса 4 px.
 * - `.v3-track` — дорожка этапа: текущий отрезок шире и выше.
 * - `.v3-toasts` — «Отменить» у нижнего края окна в верхнем слое;
 *   `[data-edge="top"]` — «Вышла новая версия» у верхнего края.
 * Движение — до 200 мс и только при `prefers-reduced-motion: no-preference`.
 */
.v3-world[data-surface="staff"] .v3-chip {
  display: inline-flex;
  max-width: 100%;
  min-height: 20px;
  align-items: center;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
  padding: 1px 7px;
  color: var(--text-2);
  white-space: nowrap;
}
/* Слово в узкой ячейке таблицы переносится: чип перестаёт быть пилюлей, но остаётся целым словом. */
.v3-world[data-surface="staff"] .v3-chip[data-wrap] {
  border-radius: 10px;
  white-space: normal;
  text-wrap: balance;
}
.v3-world[data-surface="staff"] .v3-chip[data-size="sm"] {
  min-height: 18px;
  margin-block: -1px;
  padding: 0 6px;
}
.v3-world[data-surface="staff"] .v3-chip[data-tone="danger"] {
  border-color: transparent;
  background: var(--danger-weak);
  color: var(--danger);
}
.v3-world[data-surface="staff"] .v3-chip[data-tone="warn"] {
  border-color: transparent;
  background: var(--warn-weak);
  color: var(--warn);
}
.v3-world[data-surface="staff"] .v3-chip[data-tone="ok"] {
  border-color: transparent;
  background: var(--ok-weak);
  color: var(--ok);
}
.v3-world[data-surface="staff"] .v3-chip[data-tone="info"] {
  border-color: transparent;
  background: var(--info-weak);
  color: var(--info);

.v3-world[data-surface="staff"] :is(.v3-stage, .v3-track-step)[data-phase="sales"] {
  --phase: var(--phase-sales);
}
.v3-world[data-surface="staff"] :is(.v3-stage, .v3-track-step)[data-phase="admission"] {
  --phase: var(--phase-admission);
}
.v3-world[data-surface="staff"] :is(.v3-stage, .v3-track-step)[data-phase="visa"] {
  --phase: var(--phase-visa);
}
.v3-world[data-surface="staff"] .v3-stage {
  display: inline-flex;
  max-width: 100%;
  align-items: baseline;
  gap: 6px;
  text-wrap: pretty;
}
.v3-world[data-surface="staff"] .v3-phase-dot {

/*
 * «Маркетинг» — цвета каналов «Откуда узнал» (решение владельца 10.10.2026,
 * DESIGN.md). Цвет — только категория канала и всегда рядом со словом; числа и
 * подписи остаются в цветах текста. Порядок и шаги проверены валидатором dataviz
 * на листе: светлота и хрома в полосе, соседние пары при протанопии/дейтеранопии
 * ΔE ≥ 14.2, при обычном зрении ≥ 18.2. Оттенки не совпадают с брендом, фазами и
 * статусами (синий светлее «инфо», зелень светлее «готово»). Розе (2.6:1 на листе)
 * подпись обязательна. «Не известно» и «без привязки» — пустой кружок и
 * штриховка: отличие формой, а не только цветом.
 */
.v3-world[data-surface="staff"] {
  --channel-instagram-ads: #c4502a;
  --channel-instagram: #df85ab;
  --channel-website-search: #3a6fc4;
  --channel-referral: #2b9a7b;
  --channel-other: #9469cf;
  --channel-unknown: #8a8378;
  /* Анкеты на платформе — не канал и не «Не известно»: светлый нейтральный пункт. */
  --channel-cabinet: #c9c3b8;
}
.v3-world[data-surface="staff"] [data-channel="instagram_ads"] { --channel: var(--channel-instagram-ads); }
.v3-world[data-surface="staff"] [data-channel="instagram"] { --channel: var(--channel-instagram); }
.v3-world[data-surface="staff"] [data-channel="website_search"] { --channel: var(--channel-website-search); }
.v3-world[data-surface="staff"] [data-channel="referral"] { --channel: var(--channel-referral); }
.v3-world[data-surface="staff"] [data-channel="other"] { --channel: var(--channel-other); }
.v3-world[data-surface="staff"] :is([data-channel="unknown"], [data-channel="without_lead"]) { --channel: var(--channel-unknown); }
.v3-world[data-surface="staff"] [data-channel="cabinet"] { --channel: var(--channel-cabinet); }

/*

 * открыто — тоже; на экране касания (нет наведения) — всегда. Невидимая кнопка остаётся в порядке Tab, поэтому доходит до неё
