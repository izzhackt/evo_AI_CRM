name: evo-inbox

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set in .env.production and pass with docker compose --env-file}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set in .env.production and pass with docker compose --env-file}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://inbox.evoadmissions.com}
        EVO_IMAGE_SOURCE: "${EVO_IMAGE_SOURCE:-https://github.com/izzhackt/evo_AI_CRM}"
        EVO_IMAGE_REVISION: "${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
        EVO_IMAGE_VERSION: "${EVO_RELEASE_VERSION:?set EVO_RELEASE_VERSION}"
    image: "evo-inbox:${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
    restart: unless-stopped
    env_file:
      - "${EVO_INBOX_APP_ENV_FILE:-../.env.production}"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://inbox.evoadmissions.com}
      EVO_INBOX_DOMAIN: ${EVO_INBOX_DOMAIN:-inbox.evoadmissions.com}
      EVO_CADDY_NETWORK: ${EVO_CADDY_NETWORK:-evo_public_web}
    expose:
      - '3000'
    depends_on:
      waha:
        condition: service_healthy
    networks:
      private:
        aliases:
          - evo-inbox-app
      web:
        aliases:
          - evo-inbox-app
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  waha:
    image: "${EVO_WAHA_IMAGE_REPOSITORY:-devlikeapro/waha}@${EVO_WAHA_IMAGE_DIGEST:?set EVO_WAHA_IMAGE_DIGEST to an immutable sha256 digest}"
    container_name: evo-inbox-waha
    restart: unless-stopped
    env_file:
      - "${EVO_INBOX_WAHA_ENV_FILE:-../.env.waha}"
    expose:
      - '3000'
    volumes:
      - evo_inbox_waha_sessions:/app/.sessions
    networks:
      private:
        aliases:
          - evo-inbox-waha
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/ping'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  private:
    name: evo_inbox_private
  web:
    external: true
    name: ${EVO_CADDY_NETWORK:-evo_public_web}

volumes:
  evo_inbox_waha_sessions:
