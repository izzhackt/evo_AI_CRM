services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${EVO_POSTGRES_USER:?set EVO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EVO_POSTGRES_PASSWORD:?set EVO_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EVO_POSTGRES_DB:?set EVO_POSTGRES_DB}
    ports:
      - 127.0.0.1:${EVO_POSTGRES_PORT:?set EVO_POSTGRES_PORT}:5432
    volumes:
      - postgres-local-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-local-data:
