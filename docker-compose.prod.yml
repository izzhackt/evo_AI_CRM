name: evo-crm

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EVO_IMAGE_SOURCE: "${EVO_IMAGE_SOURCE:-https://github.com/izzhackt/evo_AI_CRM}"
        EVO_IMAGE_REVISION: "${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
        EVO_IMAGE_VERSION: "${EVO_RELEASE_VERSION:?set EVO_RELEASE_VERSION}"
    image: "evo-crm:${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
    labels:
      org.opencontainers.image.revision: "${EVO_RELEASE_REVISION}"
      org.opencontainers.image.version: "${EVO_RELEASE_VERSION}"
    restart: unless-stopped
    init: true
    cpus: "1.50"
    mem_limit: 1536m
    pids_limit: 256
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - "${EVO_CRM_APP_ENV_FILE:-.env.production}"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      EVO_DB_PATH: /app/data/edu-admin.db
      EVO_BACKUP_DIR: /app/backups
    expose:
      - "3000"
    volumes:
      - evo_crm_data:/app/data
      - evo_crm_output:/app/output
      - evo_crm_backups:/app/backups
    networks:
      private:
        aliases:
          - evo-crm-app
      web:
        aliases:
          - evo-crm-app
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  waha:
    image: "${EVO_WAHA_IMAGE_REPOSITORY:-devlikeapro/waha}@${EVO_WAHA_IMAGE_DIGEST:?set EVO_WAHA_IMAGE_DIGEST to an immutable sha256 digest}"
    labels:
      com.evo.image.provenance: "third-party-digest"
    restart: unless-stopped
    init: true
    cpus: "2.00"
    mem_limit: 2048m
    pids_limit: 512
    logging: *bounded-logging
    env_file:
      - "${EVO_CRM_WAHA_ENV_FILE:-.env.waha}"
    expose:
      - "3000"
    volumes:
      - evo_crm_waha_sessions:/app/.sessions
    networks:
      private:
        aliases:
          - evo-crm-waha
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  lead-agent:
    build:
      context: ./evo-lead-agent
      dockerfile: Dockerfile
      args:
        EVO_IMAGE_SOURCE: "${EVO_IMAGE_SOURCE:-https://github.com/izzhackt/evo_AI_CRM}"
        EVO_IMAGE_REVISION: "${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
        EVO_IMAGE_VERSION: "${EVO_RELEASE_VERSION:?set EVO_RELEASE_VERSION}"
    image: "evo-lead-agent:${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
    labels:
      org.opencontainers.image.revision: "${EVO_RELEASE_REVISION}"
      org.opencontainers.image.version: "${EVO_RELEASE_VERSION}"
    restart: unless-stopped
    init: true
    cpus: "1.00"
    mem_limit: 768m
    pids_limit: 192
    logging: *bounded-logging
    env_file:
      - "${EVO_CRM_LEAD_AGENT_ENV_FILE:-.env.lead-agent}"
    environment:
      EVO_AGENT_ENV: production
      EVO_AGENT_DB_PATH: /app/data/evo-lead-agent.db
      EVO_AGENT_WAHA_BASE_URL: http://evo-crm-waha:3000
      EVO_AGENT_WAHA_SESSION: crm_primary
      EVO_AGENT_CRM_BASE_URL: http://evo-crm-app:3000
      EVO_AGENT_CRM_SYNC_PATH: /api/internal/lead-agent/whatsapp
      EVO_AGENT_FROZEN: "true"
      EVO_AGENT_WORKER_ENABLED: "false"
      EVO_AGENT_AUTOREPLY_ENABLED: "false"
      EVO_AGENT_OUTBOUND_ENABLED: "false"
    expose:
      - "8000"
    volumes:
      - evo_crm_lead_agent_data:/app/data
    depends_on:
      - app
      - waha
    networks:
      private:
        aliases:
          - evo-lead-agent
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport json, urllib.request\nr=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\nraise SystemExit(0 if json.load(r).get('ok') else 1)\nPY"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  document-validation-scanner:
    profiles:
      - student-documents
    image: "clamav/clamav:1.5.3-debian13-slim"
    restart: unless-stopped
    init: true
    user: clamav
    entrypoint:
      - /init-unprivileged
    cpus: "2.00"
    mem_limit: 4g
    pids_limit: 512
    logging: *bounded-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3310"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /run/clamav:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - evo_crm_clamav_signatures:/var/lib/clamav
    networks:
      document-validation:
        aliases:
          - evo-document-validation-scanner

  document-validation-worker:
    profiles:
      - student-documents
    build:
      context: .
      dockerfile: Dockerfile
      target: document-validation-worker
      args:
        EVO_IMAGE_SOURCE: "${EVO_IMAGE_SOURCE:-https://github.com/izzhackt/evo_AI_CRM}"
        EVO_IMAGE_REVISION: "${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
        EVO_IMAGE_VERSION: "${EVO_RELEASE_VERSION:?set EVO_RELEASE_VERSION}"
    image: "evo-document-validation-worker:${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
    labels:
      org.opencontainers.image.revision: "${EVO_RELEASE_REVISION}"
      org.opencontainers.image.version: "${EVO_RELEASE_VERSION}"
    restart: on-failure:5
    init: true
    cpus: "1.00"
    mem_limit: 512m
    pids_limit: 128
    logging: *bounded-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - "${EVO_CRM_DOCUMENT_WORKER_ENV_FILE:-.env.platform-document-worker}"
    environment:
      NODE_ENV: production
      EVO_DOCUMENT_VALIDATION_WORKER_ENABLED: "${EVO_DOCUMENT_VALIDATION_WORKER_ENABLED:-false}"
      EVO_CLAMAV_HOST: evo-document-validation-scanner
      EVO_CLAMAV_PORT: "3310"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      document-validation-scanner:
        condition: service_healthy
    networks:
      - document-validation

volumes:
  evo_crm_data:
  evo_crm_output:
  evo_crm_backups:
  evo_crm_waha_sessions:
  evo_crm_lead_agent_data:
  evo_crm_clamav_signatures:

networks:
  private:
    external: true
    name: evo_crm_private
  web:
    external: true
    name: ${EVO_CADDY_NETWORK:-evo_public_web}
  document-validation:
    name: evo_crm_document_validation
