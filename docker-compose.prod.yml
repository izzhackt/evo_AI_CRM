name: evo-crm

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: evo-crm:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      EVO_DB_PATH: /app/data/edu-admin.db
      EVO_BACKUP_DIR: /app/backups
    expose:
      - "3000"
    volumes:
      - evo_crm_data:/app/data
      - evo_crm_output:/app/output
      - evo_crm_backups:/app/backups
    networks:
      web:
        aliases:
          - evo-crm-app
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  evo_crm_data:
  evo_crm_output:
  evo_crm_backups:

networks:
  web:
    external: true
    name: ${EVO_CADDY_NETWORK:-acadis_acadis_web}
