name: evo-crm

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EVO_IMAGE_SOURCE: "${EVO_IMAGE_SOURCE:-https://github.com/izzhackt/evo_AI_CRM}"
        EVO_IMAGE_REVISION: "${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
        EVO_IMAGE_VERSION: "${EVO_RELEASE_VERSION:?set EVO_RELEASE_VERSION}"
    image: "evo-crm:${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
    restart: unless-stopped
    env_file:
      - "${EVO_CRM_APP_ENV_FILE:-.env.production}"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      EVO_DB_PATH: /app/data/edu-admin.db
      EVO_BACKUP_DIR: /app/backups
    expose:
      - "3000"
    volumes:
      - evo_crm_data:/app/data
      - evo_crm_output:/app/output
      - evo_crm_backups:/app/backups
    networks:
      private:
        aliases:
          - evo-crm-app
      web:
        aliases:
          - evo-crm-app
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  waha:
    image: "${EVO_WAHA_IMAGE_REPOSITORY:-devlikeapro/waha}@${EVO_WAHA_IMAGE_DIGEST:?set EVO_WAHA_IMAGE_DIGEST to an immutable sha256 digest}"
    restart: unless-stopped
    env_file:
      - "${EVO_CRM_WAHA_ENV_FILE:-.env.waha}"
    expose:
      - "3000"
    volumes:
      - evo_crm_waha_sessions:/app/.sessions
    networks:
      private:
        aliases:
          - evo-crm-waha
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/sessions').then(r=>process.exit([200,401,403].includes(r.status)?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  lead-agent:
    build:
      context: ./evo-lead-agent
      dockerfile: Dockerfile
      args:
        EVO_IMAGE_SOURCE: "${EVO_IMAGE_SOURCE:-https://github.com/izzhackt/evo_AI_CRM}"
        EVO_IMAGE_REVISION: "${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
        EVO_IMAGE_VERSION: "${EVO_RELEASE_VERSION:?set EVO_RELEASE_VERSION}"
    image: "evo-lead-agent:${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
    restart: unless-stopped
    env_file:
      - "${EVO_CRM_LEAD_AGENT_ENV_FILE:-.env.lead-agent}"
    environment:
      EVO_AGENT_ENV: production
      EVO_AGENT_DB_PATH: /app/data/evo-lead-agent.db
      EVO_AGENT_WAHA_BASE_URL: http://evo-crm-waha:3000
      EVO_AGENT_WAHA_SESSION: crm_primary
      EVO_AGENT_CRM_BASE_URL: http://evo-crm-app:3000
      EVO_AGENT_CRM_SYNC_PATH: /api/internal/lead-agent/whatsapp
    expose:
      - "8000"
    volumes:
      - evo_crm_lead_agent_data:/app/data
    depends_on:
      - app
      - waha
    networks:
      private:
        aliases:
          - evo-lead-agent
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport json, urllib.request\nr=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\nraise SystemExit(0 if json.load(r).get('ok') else 1)\nPY"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  evo_crm_data:
  evo_crm_output:
  evo_crm_backups:
  evo_crm_waha_sessions:
  evo_crm_lead_agent_data:

networks:
  private:
    external: true
    name: evo_crm_private
  web:
    external: true
    name: ${EVO_CADDY_NETWORK:-evo_public_web}
