name: evo-crm

services:
  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EVO_IMAGE_SOURCE: "${EVO_IMAGE_SOURCE:-https://github.com/izzhackt/evo_AI_CRM}"
        EVO_IMAGE_REVISION: "${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
        EVO_IMAGE_VERSION: "${EVO_RELEASE_VERSION:?set EVO_RELEASE_VERSION}"
    image: "evo-crm:${EVO_RELEASE_REVISION:?set EVO_RELEASE_REVISION to the exact full 40-character Git commit SHA}"
    labels:
      org.opencontainers.image.revision: "${EVO_RELEASE_REVISION}"
      org.opencontainers.image.version: "${EVO_RELEASE_VERSION}"
    restart: unless-stopped
    init: true
    read_only: true
    cpus: "1.50"
    mem_limit: 1536m
    pids_limit: 256
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - "${EVO_CRM_APP_ENV_FILE:-.env.production}"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      EVO_KNOWLEDGE_AGE_KEY_FILE: "/run/evo-knowledge/age.key"
      EVO_CLAMD_HOST: "evo-crm-clamav"
      EVO_CLAMD_PORT: "3310"
      EVO_CLAMD_TIMEOUT_MS: "10000"
    depends_on:
      clamav:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - evo_crm_output:/app/output
      - /etc/evo-crm/knowledge:/run/evo-knowledge:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=1001,gid=1001
    networks:
      private:
        aliases:
          - evo-crm-app
      web:
        aliases:
          - evo-crm-app
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  clamav:
    platform: linux/amd64
    image: "clamav/clamav@sha256:6c92171e6ab52529cd44452f6443dd05b2fc4d580c190ffc70f45f955cb9f4b9"
    labels:
      com.evo.image.provenance: "official-third-party-digest"
      com.evo.runtime.role: "private-malware-scanner"
    restart: unless-stopped
    init: true
    cpus: "2.00"
    mem_limit: 4096m
    pids_limit: 256
    logging: *bounded-logging
    expose:
      - "3310"
    volumes:
      - evo_crm_clamav_signatures:/var/lib/clamav
    networks:
      private:
        aliases:
          - evo-crm-clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  waha:
    image: "${EVO_WAHA_IMAGE_REPOSITORY:-devlikeapro/waha}@${EVO_WAHA_IMAGE_DIGEST:?set EVO_WAHA_IMAGE_DIGEST to an immutable sha256 digest}"
    labels:
      com.evo.image.provenance: "third-party-digest"
    restart: unless-stopped
    init: true
    cpus: "2.00"
    mem_limit: 2048m
    pids_limit: 512
    logging: *bounded-logging
    env_file:
      - "${EVO_CRM_WAHA_ENV_FILE:-.env.waha}"
    expose:
      - "3000"
    volumes:
      - evo_crm_waha_sessions:/app/.sessions
    networks:
      private:
        aliases:
          - evo-crm-waha
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/ping').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # «ИИ-агент» (plan docs/EVO_AI_AGENT_PLAN_2026-10-06.md §4.2, §4.6, ADR 0032).
  # Off unless the `ai-agent` profile is enabled: a plain `docker compose` call and
  # every release with EVO_AI_AGENT_ENABLED unset render exactly app, clamav and waha.
  # The private GHCR image is pinned only by digest; an unset digest is harmless while
  # the profile is off, and the release controller refuses it when the profile is on.
  ai-agent-api:
    platform: linux/amd64
    profiles: ["ai-agent"]
    image: "ghcr.io/izzhackt/evo-ai-agent@${EVO_AI_AGENT_IMAGE_DIGEST:-}"
    labels:
      com.evo.image.provenance: "private-ghcr-digest"
      com.evo.runtime.role: "private-ai-agent-api"
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 128
    logging: *bounded-logging
    env_file:
      - "${EVO_CRM_AI_AGENT_ENV_FILE:-.env.ai-agent}"
    expose:
      - "8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    networks:
      private:
        aliases:
          - evo-ai-agent
    # Liveness only: /v1/health needs no database. The release checks /v1/ready.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    # SIGTERM: up to 10 s for open streams, 5 s for running answers, 10 s for the spend ledger.
    stop_grace_period: 30s

  ai-agent-worker:
    platform: linux/amd64
    profiles: ["ai-agent"]
    image: "ghcr.io/izzhackt/evo-ai-agent@${EVO_AI_AGENT_IMAGE_DIGEST:-}"
    command: ["python", "-m", "evo_ai_agent.worker"]
    labels:
      com.evo.image.provenance: "private-ghcr-digest"
      com.evo.runtime.role: "private-ai-agent-worker"
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    cpus: "1.00"
    mem_limit: 1536m
    pids_limit: 256
    logging: *bounded-logging
    env_file:
      - "${EVO_CRM_AI_AGENT_ENV_FILE:-.env.ai-agent}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    networks:
      - private
    # The queue loop touches /tmp/evo-ai-agent-worker.alive; older than 180 s = stuck.
    healthcheck:
      test: ["CMD", "python", "-m", "evo_ai_agent.worker", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s
    # SIGTERM: the current message finishes or returns to the queue; the ledger drains.
    stop_grace_period: 30s

volumes:
  evo_crm_output:
  evo_crm_clamav_signatures:
  evo_crm_waha_sessions:

networks:
  private:
    external: true
    name: ${EVO_CRM_PRIVATE_NETWORK:-evo_crm_private}
  web:
    external: true
    name: ${EVO_CADDY_NETWORK:-evo_public_web}
