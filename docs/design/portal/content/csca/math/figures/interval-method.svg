<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190" font-family="Golos Text, -apple-system, Segoe UI, Roboto, Arial, sans-serif"><title>Sign chart of (x + 1)/(x - 2) with the solution of the inequality at most 0</title><rect width="400" height="190" rx="12" fill="#ffffff"/><text x="200" y="40" font-size="18" fill="#191714" text-anchor="middle">(<tspan font-style="italic">x</tspan> + 1) / (<tspan font-style="italic">x</tspan> − 2) ≤ 0</text><line x1="24" y1="118" x2="372" y2="118" stroke="#191714" stroke-width="1.5" stroke-linecap="round"/><polygon points="382,118 372,113 372,123" fill="#191714"/><line x1="140" y1="118" x2="260" y2="118" stroke="#d70217" stroke-width="6" stroke-linecap="round"/><circle cx="140" cy="118" r="6.5" fill="#d70217" stroke="#d70217" stroke-width="2.5"/><circle cx="260" cy="118" r="6.5" fill="#ffffff" stroke="#d70217" stroke-width="2.5"/><text x="140" y="148" font-size="16" fill="#191714" text-anchor="middle">−1</text><text x="260" y="148" font-size="16" fill="#191714" text-anchor="middle">2</text><text x="80" y="96" font-size="24" fill="#177245" text-anchor="middle" font-weight="600">+</text><text x="200" y="96" font-size="24" fill="#d70217" text-anchor="middle" font-weight="600">−</text><text x="320" y="96" font-size="24" fill="#177245" text-anchor="middle" font-weight="600">+</text><text x="380" y="144" font-size="15" fill="#191714" text-anchor="middle"><tspan font-style="italic">x</tspan></text></svg>