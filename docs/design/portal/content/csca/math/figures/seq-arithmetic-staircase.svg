<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" font-family="Golos Text, -apple-system, Segoe UI, Roboto, Arial, sans-serif"><title>Bars of heights 2, 5, 8, 11, 14 for an arithmetic sequence with difference 3 and the average height 8</title><rect width="400" height="330" rx="12" fill="#ffffff"/><line x1="26" y1="266" x2="354" y2="266" stroke="#191714" stroke-width="1.5" stroke-linecap="round"/><rect x="36" y="236" width="50" height="30" fill="#e4dfd7" stroke="#191714" stroke-width="1.5" stroke-linejoin="round"/><text x="61" y="228" font-size="15" fill="#191714" text-anchor="middle">2</text><text x="61" y="287" font-size="15" fill="#191714" text-anchor="middle"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="13">1</tspan></text><rect x="100" y="191" width="50" height="75" fill="#e4dfd7" stroke="#191714" stroke-width="1.5" stroke-linejoin="round"/><text x="125" y="183" font-size="15" fill="#191714" text-anchor="middle">5</text><text x="125" y="287" font-size="15" fill="#191714" text-anchor="middle"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="13">2</tspan></text><rect x="164" y="146" width="50" height="120" fill="#e4dfd7" stroke="#191714" stroke-width="1.5" stroke-linejoin="round"/><text x="189" y="138" font-size="15" fill="#191714" text-anchor="middle">8</text><text x="189" y="287" font-size="15" fill="#191714" text-anchor="middle"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="13">3</tspan></text><rect x="228" y="101" width="50" height="165" fill="#e4dfd7" stroke="#191714" stroke-width="1.5" stroke-linejoin="round"/><text x="253" y="93" font-size="15" fill="#191714" text-anchor="middle">11</text><text x="253" y="287" font-size="15" fill="#191714" text-anchor="middle"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="13">4</tspan></text><rect x="292" y="56" width="50" height="210" fill="#e4dfd7" stroke="#191714" stroke-width="1.5" stroke-linejoin="round"/><text x="317" y="48" font-size="15" fill="#191714" text-anchor="middle">14</text><text x="317" y="287" font-size="15" fill="#191714" text-anchor="middle"><tspan font-style="italic">a</tspan><tspan dy="4" font-size="13">5</tspan></text><line x1="26" y1="146" x2="354" y2="146" stroke="#d70217" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="6 4"/><text x="30" y="137" font-size="14" fill="#d70217" text-anchor="start">(2 + 14)/2 = 8</text><text x="36" y="40" font-size="16" fill="#6b6660" text-anchor="start"><tspan font-style="italic">d</tspan> = 3</text><text x="200" y="318" font-size="16" fill="#191714" text-anchor="middle"><tspan font-style="italic">S</tspan><tspan dy="4" font-size="13">5</tspan><tspan dy="-4" dx="4">= 5 · 8 = 40</tspan></text></svg>