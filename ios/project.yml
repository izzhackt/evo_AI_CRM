name: EVOAdmissions

options:
  bundleIdPrefix: com.evoadmissions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  EVO admissions:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EVOAdmissions
    settings:
      base:
        PRODUCT_NAME: "EVO admissions"
        PRODUCT_BUNDLE_IDENTIFIER: com.evoadmissions.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "EVO admissions"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: NO
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
    dependencies:
      - package: Supabase
        product: Supabase

schemes:
  EVO admissions:
    build:
      targets:
        EVO admissions: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
