name: EVOAdmissions

options:
  bundleIdPrefix: com.evoadmissions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

configs:
  Debug: debug
  Release: release

# Debug идёт на стенд из игнорируемого Local.xcconfig. Release (архив для
# App Store) читает ReleaseBase.xcconfig, а тот подключает игнорируемый
# Release.xcconfig: его пишет scripts/write-release-config.sh из переменных
# окружения, образец в Release.xcconfig.example. Порядок выпуска в README.md,
# «Выпуск в App Store».
configFiles:
  Debug: Local.xcconfig
  Release: ReleaseBase.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  # Формулы CSCA (контракт docs/portal/csca-contract.md §14). Точная версия;
  # MIT, шрифты пакета под GUST Font License и SIL OFL.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3

targets:
  EVO admissions:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EVOAdmissions
      # Единственный источник фото-библиотеки кампусов — тот же файл, что у
      # веба (photoKey → url + CC-атрибуция). Не копия: bundle-ресурс из
      # src/lib, чтобы iOS и веб не расходились.
      - path: ../src/lib/university-photo-library.json
        buildPhase: resources
      # Гео-библиотека кампусов (волна 9b) — тот же single-source паттерн:
      # bundle-ресурс из src/lib, ключ photoKey → проверенная координата.
      - path: ../src/lib/university-geo-library.json
        buildPhase: resources
      # Один список стран продукта (282): тот же файл, что у веба и CRM.
      - path: ../src/lib/study-countries.json
        buildPhase: resources
      # «Путь поступления» (S4, 284): те же семь файлов, что читает веб
      # (src/lib/portal/country-timeline.ts); правила выбора в
      # docs/portal/country-timeline-contract.md.
      - path: ../src/content/timelines/cn.json
        buildPhase: resources
      - path: ../src/content/timelines/my.json
        buildPhase: resources
      - path: ../src/content/timelines/ae.json
        buildPhase: resources
      - path: ../src/content/timelines/tr.json
        buildPhase: resources
      - path: ../src/content/timelines/it.json
        buildPhase: resources
      - path: ../src/content/timelines/cz.json
        buildPhase: resources
      - path: ../src/content/timelines/undecided.json
        buildPhase: resources
      # Обзор экзамена CSCA (§19 контракта CSCA): тот же файл и манифест фото,
      # что читает веб (src/lib/portal/csca-overview.ts), и те же файлы WebP
      # (720 для 2x, 1280 для 3x, 240 миниатюра; JPEG манифеста нужен только
      # браузерам). Ресурсы лежат в корне bundle.
      - path: ../src/content/csca/overview.json
        buildPhase: resources
      - path: ../src/content/csca/photos.json
        buildPhase: resources
      - path: ../src/content/csca/photos/campus-sichuan-240.webp
        buildPhase: resources
      - path: ../src/content/csca/photos/campus-sichuan-720.webp
        buildPhase: resources
      - path: ../src/content/csca/photos/campus-sichuan-1280.webp
        buildPhase: resources
      - path: ../src/content/csca/photos/campus-xiamen-720.webp
        buildPhase: resources
      - path: ../src/content/csca/photos/campus-xiamen-1280.webp
        buildPhase: resources
      # Манифест переноса фото вузов в бакет (тот же файл, что читает веб,
      # src/lib/university-photo-url.ts): управляемый адрес фото вуза.
      - path: ../scripts/portal/university-photos-manifest.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "EVO admissions"
        PRODUCT_BUNDLE_IDENTIFIER: com.evoadmissions.app
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "EVO admissions"
        # Версия и номер сборки только из настроек MARKETING_VERSION и
        # CURRENT_PROJECT_VERSION выше; без этих строк xcodegen пишет
        # постоянные 1.0 и 1.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: NO
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
        # База веб-кабинета для bearer-документов (волна 8). Отсутствие или
        # пустое значение в Local.xcconfig — честный fallback в коде на
        # https://app.evoadmissions.com (AppConfig.portalWebBaseURL).
        PORTAL_WEB_BASE_URL: "$(PORTAL_WEB_BASE_URL)"
    # Release без значений из Release.xcconfig, с адресом не https:// или с
    # исключением ATS в Info.plist не собирается; архив ещё требует Team ID
    # и ключ без заглушки. В Debug шаг ничего не делает.
    preBuildScripts:
      - name: Check Release configuration
        script: '"$SRCROOT/scripts/check-release-config.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/check-release-config.sh
          - $(SRCROOT)/$(INFOPLIST_FILE)
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Supabase
        product: Supabase
      - package: SwiftMath
        product: SwiftMath

  # Hostless unit tests: компилируют только чистые Codable/логические файлы
  # (без Supabase SDK и UI), поэтому не запускают приложение и не ходят в сеть.
  EVOAdmissionsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EVOAdmissionsTests
      # CSCA: чистые модели, политика, TeX и профиль SVG; таблица строк
      # проверяется тестом на RU и KY.
      - path: EVOAdmissions/Services/CSCA
      - path: EVOAdmissions/Resources/CSCA.xcstrings
        buildPhase: resources
      - path: EVOAdmissions/Services/PortalModels.swift
      - path: EVOAdmissions/Services/AssessmentModels.swift
      - path: EVOAdmissions/Services/UniversityPhotoLibrary.swift
      - path: EVOAdmissions/Services/UniversityGeoLibrary.swift
      - path: EVOAdmissions/Services/UniversityCatalogFilterPolicy.swift
      - path: EVOAdmissions/Services/StudyCountries.swift
      # Университеты v2 (283): разбор индекса и страницы вуза по частям,
      # правила экранов, адреса фото, копия индекса на диске и хранилище
      # индекса (загрузка передаётся функцией), загрузчик фото (сеть
      # подменяется заглушкой URLProtocol).
      - path: EVOAdmissions/Services/UniversityAtlas
      - path: EVOAdmissions/Services/AtlasImageLoader.swift
      # «Путь поступления» (S4): строгий разбор, выбор и ответ RPC 284.
      - path: EVOAdmissions/Services/CountryTimeline.swift
      - path: EVOAdmissions/Services/CountryChoiceModels.swift
      - path: EVOAdmissions/Services/UniversityMapPolicy.swift
      - path: EVOAdmissions/Services/SingleFlightReloadGate.swift
      - path: EVOAdmissions/Services/PostgresTimestamp.swift
      - path: EVOAdmissions/Services/FavoritesModels.swift
      - path: EVOAdmissions/Services/PortalProfileModels.swift
      - path: EVOAdmissions/Services/ConsultationModels.swift
      - path: EVOAdmissions/Services/LearningModels.swift
      - path: EVOAdmissions/Services/LearningRunnerModels.swift
      - path: EVOAdmissions/Services/PortalCaseChatModels.swift
      - path: EVOAdmissions/Services/ProfessionModels.swift
      - path: EVOAdmissions/Services/AdmissionModels.swift
      - path: EVOAdmissions/Services/PortalDocumentTransfer.swift
      - path: EVOAdmissions/Services/ApplicationIntakeModels.swift
      - path: EVOAdmissions/Services/ApplicationIntakePolicy.swift
      - path: EVOAdmissions/Services/ApplicationIntakeTransfer.swift
      - path: EVOAdmissions/Services/MotionPolicy.swift
      # Ключи каталога для серверных статусов и безопасный разбор UUID
      # (аудит UX/UI 2026-10): тестам нужны сами перечисления статусов.
      - path: EVOAdmissions/Services/LocalizationKeys.swift
      - path: EVOAdmissions/Services/ServerUUID.swift
      - path: EVOAdmissions/Services/AuthMessagePolicy.swift
      - path: EVOAdmissions/Services/CatalogPreparationModels.swift
      - path: EVOAdmissions/Services/ApplicationRequirementsModels.swift
      - path: EVOAdmissions/Services/ApplicationRequirementsV2Models.swift
      - path: EVOAdmissions/Services/ApplicationDocumentModels.swift
      - path: EVOAdmissions/Services/ApplicationPackageModels.swift
      - path: EVOAdmissions/Services/ApplicationDocumentUpload.swift
      # Экран «Лицензии» и ссылка на политику (review #1215): список
      # уведомлений сверяется с Package.resolved, тексты читаются из бандла.
      - path: EVOAdmissions/Services/ThirdPartyNotices.swift
      - path: EVOAdmissions/Resources/Licenses
        buildPhase: resources
      - path: ../src/lib/university-photo-library.json
        buildPhase: resources
      - path: ../src/lib/university-geo-library.json
        buildPhase: resources
      - path: ../src/lib/study-countries.json
        buildPhase: resources
      - path: ../src/content/timelines/cn.json
        buildPhase: resources
      - path: ../src/content/timelines/my.json
        buildPhase: resources
      - path: ../src/content/timelines/ae.json
        buildPhase: resources
      - path: ../src/content/timelines/tr.json
        buildPhase: resources
      - path: ../src/content/timelines/it.json
        buildPhase: resources
      - path: ../src/content/timelines/cz.json
        buildPhase: resources
      - path: ../src/content/timelines/undecided.json
        buildPhase: resources
      # Обзор экзамена CSCA: те же файлы, что у приложения; тест сверяет
      # фото с хешами манифеста и разбор с вебом (фикстура паритета).
      - path: ../src/content/csca/overview.json
        buildPhase: resources
      - path: ../src/content/csca/photos.json
        buildPhase: resources
      - path: ../src/content/csca/photos/campus-sichuan-240.webp
        buildPhase: resources
      - path: ../src/content/csca/photos/campus-sichuan-720.webp
        buildPhase: resources
      - path: ../src/content/csca/photos/campus-sichuan-1280.webp
        buildPhase: resources
      - path: ../src/content/csca/photos/campus-xiamen-720.webp
        buildPhase: resources
      - path: ../src/content/csca/photos/campus-xiamen-1280.webp
        buildPhase: resources
      # Общие векторы текста и ссылок каталога 283 (контракт 2.2a): те же,
      # что проверяют SQL-набор 283 и tests/catalog-text.test.mjs.
      - path: ../tests/fixtures/catalog-text-vectors.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evoadmissions.app.tests
        GENERATE_INFOPLIST_FILE: YES
    # Тест разбора SwiftMath на каждом фрагменте TeX из реальных ответов.
    dependencies:
      - package: SwiftMath
        product: SwiftMath

schemes:
  EVO admissions:
    build:
      targets:
        EVO admissions: all
        EVOAdmissionsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EVOAdmissionsTests
    archive:
      config: Release
