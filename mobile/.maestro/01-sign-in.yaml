appId: com.evoadmissions.app
name: Вход студента
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: login-input
    timeout: 120000
# Неверный пароль: экран остаётся, показывается ошибка.
- tapOn:
    id: login-input
- inputText: ${MAESTRO_E2E_LOGIN}
- tapOn:
    id: password-input
- inputText: not-the-password
- pressKey: Enter
- assertVisible:
    id: sign-in-error
# Верный пароль: кабинет.
- tapOn:
    id: password-input
- eraseText: 40
- inputText: ${MAESTRO_E2E_PASSWORD}
- pressKey: Enter
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
# 356: студенту без решения о Политике и ИИ первым открывается экран «Конфиденциальность» - проходим его.
- extendedWaitUntil:
    visible:
      id: "home-screen|consent-submit"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: consent-submit
    file: subflows/pass-consent.yaml
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
