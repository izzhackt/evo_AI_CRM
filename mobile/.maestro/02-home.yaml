appId: com.evoadmissions.app
name: Главная после входа
---
- runFlow: subflows/fresh-login.yaml
- assertVisible:
    id: home-screen
# Герой дела с треком этапов: страница может быть прокручена (подгрузка карточек), поэтому ищем прокруткой вверх.
- scrollUntilVisible:
    element:
      id: stage-track
    direction: UP
    timeout: 60000
