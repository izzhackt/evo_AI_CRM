appId: com.evoadmissions.app
name: Университеты, страна, вуз, избранное
---
- runFlow: subflows/fresh-login.yaml
- runFlow:
    file: subflows/open-section.yaml
    env:
      SECTION: universities
# «Университеты» открываются сразу на странице страны самого студента (у `test.assisted` это Китай; `useEntryRedirect` заменяет
# список стран страницей его страны), поэтому нажимать на карточку страны не нужно: ждём переключатель вида `view-list` этой страницы.
# Прежнее ожидание `country-.*` здесь не годится: ему отвечают поле поиска `country-search` и фото `country-photo` страницы страны;
# первое совпадение было полем поиска под плавающей панелью вкладок, и нажатие попадало во вкладку «Документы» (QA#3, N4).
- extendedWaitUntil:
    visible:
      id: view-list
    timeout: 30000
# Список вузов страны: плитки вузов (вид «Список» показывает их сразу).
- tapOn:
    id: view-list
- extendedWaitUntil:
    visible:
      id: "tile-.*"
    timeout: 20000
- tapOn:
    id: "tile-.*"
- extendedWaitUntil:
    visible:
      id: "heart-.*"
    timeout: 20000
# Сердце: состояние «в избранном» меняется туда и обратно.
- copyTextFrom:
    id: "heart-.*"
- tapOn:
    id: "heart-.*"
- waitForAnimationToEnd
- tapOn:
    id: "heart-.*"
- waitForAnimationToEnd
- assertVisible:
    id: "heart-.*"
