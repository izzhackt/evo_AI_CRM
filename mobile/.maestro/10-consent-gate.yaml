appId: com.evoadmissions.app
name: Экран «Конфиденциальность»
# Нужен студент БЕЗ решения о Политике и ИИ (миграция 356): перед запуском удалите его строки из
# platform_private.student_privacy_consents и student_ai_consents на ЛОКАЛЬНОМ стенде, например
#   EVO_E2E_ACCOUNT=approved npm run e2e:ios -- .maestro/10-consent-gate.yaml
# Потоки 01-09 сами проходят этот экран (subflows/pass-consent.yaml); при полном прогоне этот поток пропустите,
# если студент уже решил (тогда экран не показывается и поток по замыслу падает на проверке экрана).
tags:
  - needs-undecided
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: login-input
    timeout: 120000
- tapOn:
    id: login-input
- inputText: ${MAESTRO_E2E_LOGIN}
- tapOn:
    id: password-input
- inputText: ${MAESTRO_E2E_PASSWORD}
- pressKey: Enter
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
# Первым открывается экран, не «Главная».
- extendedWaitUntil:
    visible:
      id: consent-submit
    timeout: 30000
- assertNotVisible:
    id: home-screen
- assertVisible:
    id: consent-policy
- assertVisible:
    id: consent-ai
- takeScreenshot: consent-empty
# Без обеих галочек «Продолжить» не уходит дальше: одна галочка - всё ещё экран.
- tapOn:
    id: consent-ai
- tapOn:
    id: consent-submit
- assertVisible:
    id: consent-submit
- assertNotVisible:
    id: home-screen
# Обе галочки и «Продолжить» ведут на «Главную».
# Центр строки - ссылка на Политику (открывает браузер), поэтому жмём по самой галочке слева.
- tapOn:
    id: consent-policy
    point: 4%,40%
- takeScreenshot: consent-both
- tapOn:
    id: consent-submit
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
# Повторный запуск: решение уже есть, экран больше не возвращается.
- launchApp
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 60000
- assertNotVisible:
    id: consent-submit
