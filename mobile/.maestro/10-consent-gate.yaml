appId: com.evoadmissions.app
name: Экран «Конфиденциальность»
# Нужен студент БЕЗ решения о Политике и ИИ (миграция 356): на локальном стенде это `approved`, пока под ним не прошли экран
# (свежий `npm run mobile:stack:up`; либо `mobile:stack:down` и `up`; либо удалите его строки из platform_private.student_privacy_consents
# и student_ai_consents на ЛОКАЛЬНОМ стенде). Запуск только по имени файла:
#   EVO_E2E_ACCOUNT=approved npm run e2e:ios -- .maestro/10-consent-gate.yaml
# В общий прогон поток не входит: метку `needs-undecided` исключает config.yaml (excludeTags). Потоки 01-08 и 11 сами проходят этот
# экран (subflows/pass-consent.yaml) под `assisted`, после них студент уже решил, экран не показывается, и поток по замыслу падает на
# проверке экрана. Подробнее: docs/mobile/E2E.md, «Поток 10: только вручную».
tags:
  - needs-undecided
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: login-input
    timeout: 120000
- tapOn:
    id: login-input
- inputText: ${MAESTRO_E2E_LOGIN}
- tapOn:
    id: password-input
- inputText: ${MAESTRO_E2E_PASSWORD}
- pressKey: Enter
# Системный запрос «Сохранить пароль?» (язык системы любой) закрываем, если он появился.
- runFlow: subflows/dismiss-save-password.yaml
# Первым открывается экран, не «Главная».
- extendedWaitUntil:
    visible:
      id: consent-submit
    timeout: 30000
- assertNotVisible:
    id: home-screen
- assertVisible:
    id: consent-policy
- assertVisible:
    id: consent-ai
- takeScreenshot: consent-empty
# Без обеих галочек «Продолжить» не уходит дальше: одна галочка - всё ещё экран.
- tapOn:
    id: consent-ai
- tapOn:
    id: consent-submit
- assertVisible:
    id: consent-submit
- assertNotVisible:
    id: home-screen
# Обе галочки и «Продолжить» ведут на «Главную».
# Центр строки - ссылка на Политику (открывает браузер), поэтому жмём по самой галочке слева.
- tapOn:
    id: consent-policy
    point: 4%,40%
- takeScreenshot: consent-both
- tapOn:
    id: consent-submit
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
# Повторный запуск: решение уже есть, экран больше не возвращается.
- launchApp
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 60000
- assertNotVisible:
    id: consent-submit
