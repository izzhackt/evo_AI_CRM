# Maestro: порядок и набор потоков. Запуск: npm run e2e:ios | npm run e2e:android (scripts/e2e.mjs).
flows:
  - "[0-9][0-9]-*.yaml"
# Поток с меткой `needs-undecided` в общий прогон не входит: ему нужен студент, который ещё не решал по Политике и ИИ, а после
# любого входа под тем же студентом экран «Конфиденциальность» больше не показывается (поток по замыслу падает). Он запускается
# отдельно и по имени файла (одиночный файл метки не фильтруют): docs/mobile/E2E.md, «Поток 10: только вручную».
excludeTags:
  - needs-undecided
