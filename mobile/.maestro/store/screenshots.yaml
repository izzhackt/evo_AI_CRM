# Скриншоты для магазинов (docs/mobile/STORE_LISTING.md, раздел 9): светлая тема, русский, студент уровня «сопровождение».
# Запуск: EVO_E2E_OUT=<каталог> npm run e2e:ios|e2e:android -- .maestro/store/screenshots.yaml, PNG пишутся в
# <каталог>/<дата>/<имя потока>/takeScreenshot/. Данные локального стенда перед съёмкой приводятся к «живому» виду
# (имя, названия файлов, переписка, оплата, вузы с фото): см. docs/mobile/STORE_LISTING.md, раздел 9.
appId: com.evoadmissions.app
name: Скриншоты для магазинов
---
- runFlow: ../subflows/fresh-login.yaml
- scrollUntilVisible:
    element:
      id: home-hero
    direction: UP
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 01-home
- tapOn:
    id: tab-documents
- extendedWaitUntil:
    visible:
      id: title-documents
    timeout: 30000
# Список приходит после заголовка: ждём первую строку, а не скелетон.
- extendedWaitUntil:
    visible: "Загранпаспорт"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 02-documents
- tapOn:
    id: tab-messages
- extendedWaitUntil:
    visible:
      id: inbox-chat
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: inbox-chat
- extendedWaitUntil:
    visible:
      id: chat-screen
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 03-messages
- tapOn:
    id: chat-back
- runFlow:
    file: ../subflows/open-section.yaml
    env:
      SECTION: payments
- extendedWaitUntil:
    visible:
      id: title-payments
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 04-payments
- runFlow:
    file: ../subflows/open-section.yaml
    env:
      SECTION: universities
- extendedWaitUntil:
    visible:
      id: "country-.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 05-universities
- tapOn:
    id: country-CN
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
- takeScreenshot: 08-universities-china
- runFlow:
    file: ../subflows/open-section.yaml
    env:
      SECTION: csca
- extendedWaitUntil:
    visible:
      id: csca-screen
    timeout: 30000
# Раздел открывается на «Об экзамене» (как на сайте), а на скриншоте магазина нужна подготовка: следующий шаг, плитки, тесты на время.
- tapOn:
    id: csca-tab-lessons
- extendedWaitUntil:
    visible:
      id: csca-lessons
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 06-csca
- runFlow:
    file: ../subflows/open-section.yaml
    env:
      SECTION: profile
- extendedWaitUntil:
    visible:
      id: profile-screen
    timeout: 20000
- scrollUntilVisible:
    element:
      id: theme-light
    direction: DOWN
- scroll
- waitForAnimationToEnd
- tapOn:
    id: theme-light
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: profile-name
    direction: UP
- swipe:
    start: 50%,70%
    end: 50%,48%
- waitForAnimationToEnd
- takeScreenshot: 07-profile
