# Системный запрос «Сохранить пароль?» после входа - не часть приложения и приходит на языке СИСТЕМЫ, а не приложения: закрываем
# его кнопкой отказа, если он появился; иначе поток идёт дальше (`optional`). Подпись - регулярное выражение, которое Maestro
# сравнивает с подписью целиком и без учёта регистра; пробел в подписи записан точкой: в русской подписи окон iOS бывает и
# неразрывный. Откуда подписи:
#  - iOS: ключ «Not Now» в системных строках симулятора iOS 26.5 (PasswordManagerUI, AuthenticationServicesCore,
#    SafariSharedUI), все 54 языка системы. Киргизского в iOS нет;
#  - Android: окно автозаполнения платформы, кнопки «Not now» и «No thanks» (AOSP, `autofill_save_notnow` и `autofill_save_no`):
#    en, ru, ky («Азыр эмес», «Жок, рахмат»), uk, kk, uz. Другие языки Android не перечислены.
# «Сохранить» и постоянный отказ («Never», «Никогда», «Эч качан») не нажимаем. Какие подписи покрыты, держит
# src/__tests__/maestro-flows.test.ts (подпись проверяется тем же выражением, что читает Maestro).
appId: com.evoadmissions.app
---
- tapOn:
    text: 'Not.Now|Не.сейчас|Азыр.эмес|Қазір.емес|Не.зараз|Keyinroq|No.thanks|Нет,.спасибо|Жок,.рахмат|Жоқ,.рақмет|Ні,.дякую|Kerak.emas|Agora.Não|Ahora.no|Ara.no|Bukan.Sekarang|Décider.plus.tard|Ei.nyt|Ikke.nu|Ikke.nå|Inte.nu|Most.nem|Nanti|Ne.dabar|Ne.sad|Ne.zdaj|Nie.teraz|Niet.nu|Non.ora|Nu.acum|Plus.tard|Sonra|Später|Teraz.nie|Teď.ne|Để.sau|Όχι.τώρα|Не.сега|לא.כעת|ابھی.نہیں|ليس.الآن|अभी.नहीं|आत्ता.नाही|এখন.নয়|ਹਾਲੇ.ਨਹੀਂ|અત્યારે.નહિ|હમણાં.નહિ|ଏବେ.ନୁହେଁ|ବର୍ତ୍ତମାନ.ନୁହେଁ|இப்போது.வேண்டாம்|ఇప్పుడు.కాదు|ఇప్పుడు.వద్దు|ಈಗ.ಬೇಡ|ഇപ്പോൾ.വേണ്ട|ഇപ്പോൾ.വേണ്ട|ไม่ใช่ตอนนี้|今はしない|以后|稍後再說|稍後決定|지금.안.함'
    optional: true
