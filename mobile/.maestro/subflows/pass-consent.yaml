# Экран «Конфиденциальность» (миграция 356): обе галочки и «Продолжить». Вызывается только когда экран открыт.
appId: com.evoadmissions.app
---
# Центр строки - ссылка на Политику (открывает браузер), поэтому жмём по самой галочке слева.
- tapOn:
    id: consent-policy
    point: 4%,40%
- tapOn:
    id: consent-ai
- tapOn:
    id: consent-submit
