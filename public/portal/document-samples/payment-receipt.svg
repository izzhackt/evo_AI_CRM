<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Вымышленный образец чека">
  <rect width="640" height="400" rx="16" fill="#f7f8fa"/>
  <rect x="150" y="24" width="340" height="352" rx="10" fill="#fff" stroke="#e3e5e9"/>
  <text x="320" y="64" text-anchor="middle" font-family="Golos Text, system-ui, sans-serif" font-size="16" font-weight="700" fill="#17181c">ЧЕК</text>
  <text x="320" y="86" text-anchor="middle" font-family="Golos Text, system-ui, sans-serif" font-size="12" fill="#5c616b">Sample receipt</text>
  <g font-family="Golos Text, system-ui, sans-serif" font-size="13" fill="#17181c">
    <text x="178" y="130" fill="#5c616b">Получатель</text>
    <text x="178" y="150" font-weight="700">EVO SAMPLE</text>
    <text x="400" y="130" fill="#5c616b">Дата</text>
    <text x="400" y="150" font-weight="700">03.11.2026</text>
    <text x="178" y="196" fill="#5c616b">Назначение</text>
    <text x="178" y="216">Оплата услуг · образец</text>
    <text x="178" y="262" fill="#5c616b">Сумма</text>
    <text x="178" y="292" font-size="28" font-weight="800">10 000</text>
    <text x="300" y="292" font-size="16">KGS</text>
  </g>
  <text x="178" y="340" font-family="ui-monospace, monospace" font-size="11" fill="#8a8b93">№ 0000 0000 1234</text>
  <text x="320" y="396" text-anchor="middle" font-family="Golos Text, system-ui, sans-serif" font-size="11" fill="#8a8b93">Invented payment · not a bank document</text>
  <g transform="rotate(-24 320 200)" opacity="0.28">
    <text x="320" y="210" text-anchor="middle" fill="#d70217" font-family="Golos Text, system-ui, sans-serif" font-size="56" font-weight="800">ОБРАЗЕЦ</text>
  </g>
</svg>
