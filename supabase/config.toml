# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config

# Distinguishes this disposable local stack from every other Supabase project
# on the same Docker host.
project_id = "evo-platform-local"

# EVO reserves 45420-45429 for this repository's local Supabase test stack.
# The final digit mirrors Supabase's generated default ports while avoiding the
# 5432x block already used by an unrelated local project.
[api]
enabled = true
port = 45421
schemas = ["public", "platform", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 45422
shadow_port = 45420
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 45429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

# Local verification loads no seed file or customer-like fixture data during
# either `supabase start` or `supabase db reset`.
[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 45423
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 45424
smtp_port = 45425
pop3_port = 45426

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[storage.buckets.platform-documents]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["application/pdf", "image/jpeg", "image/png"]

# V3-F canonical private company knowledge files. The browser can insert only
# one exact reserved object; reads and signing remain trusted-server actions.
[storage.buckets.platform-company-files]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["application/pdf", "image/jpeg", "image/png", "text/plain", "text/csv", "application/msword", "application/vnd.ms-excel", "application/vnd.ms-powerpoint", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "application/vnd.openxmlformats-officedocument.presentationml.presentation"]

# P5D fixed private archive for already-projected evo-inbox media. Browser
# principals receive neither a Storage select policy nor bucket/object names;
# a backend service signs only after consuming an audited one-time grant.
[storage.buckets.platform-whatsapp-media]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["application/octet-stream", "application/pdf", "image/gif", "image/jpeg", "image/png", "image/webp", "audio/mpeg", "audio/ogg", "audio/wav", "video/mp4"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/platform_private/custom_access_token_hook"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 45428
deno_version = 2

[analytics]
enabled = true
port = 45427
backend = "postgres"
