<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Подтвердите email для EVO Admissions</title>
  </head>
  <body style="margin:0;padding:24px 16px;background-color:#ffffff;color:#222222;font-family:Golos,Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;">
    <!-- Proposed27c Confirm template; not installed. RedirectTo is server-built and ends in #cap=... . -->
    <div style="max-width:560px;margin:0 auto;">
      <p style="margin:0 0 24px;font-size:18px;font-weight:700;">EVO Admissions</p>
      <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Подтвердите адрес почты, чтобы продолжить регистрацию в EVO Admissions.</h1>
      <p style="margin:0 0 24px;">Нажмите кнопку, чтобы продолжить подтверждение почты.</p>
      <p style="margin:0 0 24px;">
        <a href="{{ .RedirectTo }}&amp;otp={{ .Token }}" style="display:inline-block;box-sizing:border-box;min-height:48px;padding:12px 20px;border-radius:6px;background-color:#d70217;color:#ffffff;font-weight:700;line-height:24px;text-align:center;text-decoration:underline;">Подтвердить email</a>
      </p>
      <p style="margin:0 0 16px;">Если вы не регистрировались, проигнорируйте это письмо.</p>
      <p style="margin:0;">Вопросы: evo@evoadmissions.com</p>
    </div>
  </body>
</html>
