[project]
name = "evo-passport-sheet"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.177,<3",
  "google-auth-oauthlib>=1.2,<2",
  "Unidecode>=1.4,<2",
]

[project.scripts]
evo-passport-sheet = "evo_passport_sheet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evo_passport_sheet"]

[dependency-groups]
dev = ["pytest>=8.4,<9"]
